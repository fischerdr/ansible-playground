---
version: 3

# Container image configuration for air-gapped environments
images:
  base_image:
    # Using Red Hat Universal Base Image 8 (stream) as requested
    name: registry.access.redhat.com/ubi8/ubi:8.9

# Dependencies section
dependencies:
  python_interpreter:
    package_system: python3.11
    python_path: /usr/bin/python3.11

  # Core Ansible components
  ansible_core:
    package_pip: ansible-core
  ansible_runner:
    package_pip: ansible-runner

  # External requirements - will be copied locally
  galaxy: requirements-airgapped.yml
  python: requirements-airgapped.txt

  # Additional Python requirements (will be handled in build steps)
  # requirements-collections-airgapped.txt will be installed via additional_build_steps

  # System dependencies
  system: |
    # Base requirements
    git-core [platform:rpm]
    python3.11 [platform:rpm]
    python3.11-devel [platform:rpm compile]
    python3.11-pip [platform:rpm]

    # Authentication and security
    krb5-devel [platform:rpm compile]
    krb5-workstation [platform:rpm]
    openssl-devel [platform:rpm compile]

    # Source control
    git-lfs [platform:rpm]
    subversion [platform:rpm]

    # Network and file transfer
    sshpass [platform:rpm]
    rsync [platform:rpm]
    wget [platform:rpm]
    nc [platform:rpm]
    curl [platform:rpm]

    # Container management
    podman-remote [platform:rpm]

    # Build tools
    cmake [platform:rpm compile]
    gcc [platform:rpm compile]
    gcc-c++ [platform:rpm compile]
    make [platform:rpm compile]

    # API and web service dependencies
    libcurl-devel [platform:rpm compile]

    # Utilities
    unzip [platform:rpm]
    which [platform:rpm]
    jq [platform:rpm]
    yq [platform:rpm]

    # Additional tools for cloud operations
    ca-certificates [platform:rpm]
    gnupg2 [platform:rpm]

# Additional build steps for air-gapped environment
additional_build_steps:
  prepend_base:
    # Enable CodeReady Builder (CRB) repository for additional packages
    - RUN dnf -y install dnf-utils
    - RUN dnf config-manager --set-enabled crb || dnf config-manager --set-enabled powertools || true

  append_base:
    # Update Python pip and install base tools
    - RUN python3.11 -m pip install -U pip setuptools wheel

    # Install collection-specific requirements from local wheels
    - COPY requirements-collections-airgapped.txt /tmp/requirements-collections-airgapped.txt
    - COPY wheels-collections/ /tmp/wheels-collections/
    - RUN if [ -d "/tmp/wheels-collections" ] && [ "$(ls -A /tmp/wheels-collections)" ]; then \
        python3.11 -m pip install --no-index --find-links /tmp/wheels-collections -r /tmp/requirements-collections-airgapped.txt; \
      else \
        echo "No collection dependency wheels found, skipping collection requirements"; \
      fi

    # Create directories for local tools
    - RUN mkdir -p /tmp/tools /usr/local/bin

    # Copy local tool binaries (these need to be provided in tools/ directory)
    - COPY tools/kubectl /usr/local/bin/kubectl
    - RUN chmod +x /usr/local/bin/kubectl

    - COPY tools/helm /usr/local/bin/helm
    - RUN chmod +x /usr/local/bin/helm

    - COPY tools/terraform /usr/local/bin/terraform
    - RUN chmod +x /usr/local/bin/terraform

    - COPY tools/oc /usr/local/bin/oc
    - RUN chmod +x /usr/local/bin/oc

    - COPY tools/vault /usr/local/bin/vault
    - RUN chmod +x /usr/local/bin/vault

    # Install AWS CLI from local archive
    - COPY tools/awscliv2.zip /tmp/awscliv2.zip
    - RUN cd /tmp && unzip awscliv2.zip && ./aws/install && rm -rf aws awscliv2.zip

    # Install Google Cloud SDK from local archive
    - COPY tools/google-cloud-sdk.tar.gz /tmp/google-cloud-sdk.tar.gz
    - RUN cd /root && tar xzf /tmp/google-cloud-sdk.tar.gz && rm /tmp/google-cloud-sdk.tar.gz
    - RUN /root/google-cloud-sdk/install.sh --quiet --usage-reporting=false --path-update=false
    - RUN ln -s /root/google-cloud-sdk/bin/gcloud /usr/local/bin/gcloud
    - RUN ln -s /root/google-cloud-sdk/bin/gsutil /usr/local/bin/gsutil
    - RUN ln -s /root/google-cloud-sdk/bin/bq /usr/local/bin/bq

    # Install Python packages from local wheels (if available)
    - COPY wheels/ /tmp/wheels/
    - RUN if [ -d "/tmp/wheels" ] && [ "$(ls -A /tmp/wheels)" ]; then \
        python3.11 -m pip install --no-index --find-links /tmp/wheels -r /tmp/requirements-airgapped.txt; \
      else \
        python3.11 -m pip install -r /tmp/requirements-airgapped.txt; \
      fi

  append_final:
    # Update system and clean up
    - RUN dnf -y update && dnf clean all

    # Remove Python 3.6/3.8/3.9 if present (keep only 3.11)
    - RUN dnf -y remove python3.6 python3.6-devel python3.8 python3.8-devel python3.9 python3.9-devel || true

    # Set Python 3.11 as default
    - RUN alternatives --install /usr/bin/python python /usr/bin/python3.11 311
    - RUN alternatives --set python /usr/bin/python3.11
    - RUN ln -sf /usr/bin/python3.11 /usr/bin/python3

    # Ansible configuration
    - ENV ANSIBLE_FORCE_COLOR=1
    - ENV ANSIBLE_COLLECTIONS_PATH=./collections:/usr/share/ansible/collections
    - ENV ANSIBLE_ROLES_PATH=./roles:/usr/share/ansible/roles
    - ENV ANSIBLE_HOST_KEY_CHECKING=false
    - ENV ANSIBLE_RETRY_FILES_ENABLED=false

    # Python configuration
    - ENV PYTHONPATH=/usr/local/lib/python3.11/site-packages
    - ENV PYTHONUNBUFFERED=1

    # Cloud tool configurations
    - ENV AWS_DEFAULT_REGION=us-east-1
    - ENV KUBECONFIG=/tmp/kubeconfig
    - ENV HELM_HOME=/tmp/.helm

    # Logging configuration
    - ENV LOG_LEVEL=INFO
    - ENV LOG_FORMAT=json
    - ENV LOG_DIR=/logs

    # Security settings
    - ENV REQUESTS_CA_BUNDLE=/etc/pki/tls/certs/ca-bundle.crt
    - ENV CURL_CA_BUNDLE=/etc/pki/tls/certs/ca-bundle.crt

    # Create necessary directories
    - RUN mkdir -p /tmp/.helm /tmp/.kube /logs /workspace

    # Set up PATH to include all tools
    - ENV PATH="/usr/local/bin:/root/google-cloud-sdk/bin:${PATH}"

    # Verify installations (skip version checks that require network)
    - RUN python3 --version && python --version
    - RUN which kubectl && which helm && which terraform && which oc && which vault && which aws && which gcloud
    - RUN ansible --version

    # Clean up temporary files and caches
    - RUN rm -rf /tmp/* /var/cache/dnf /var/cache/yum
    - RUN python3.11 -m pip cache purge

    # Set working directory
    - WORKDIR /workspace

    # Create non-root user for security
    - RUN useradd -m -s /bin/bash ansible
    - RUN chown -R ansible:ansible /workspace /logs
    - USER ansible

# Note: Custom build arguments removed as they are not supported by ansible-builder
# The build process uses the additional_build_steps for customization
