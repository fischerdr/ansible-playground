---
# Ansible Navigator Configuration
# Documentation: https://ansible-navigator.readthedocs.io/en/latest/settings/

ansible-navigator:

  # Execution Environment settings
  execution-environment:
    enabled: true
    container-engine: podman
    # Use the enhanced AIO EE with collection dependencies
    image: localhost/ansible-aio-ee:latest
    pull:
      policy: missing
    
    # Mount project directory for development
    container-options:
      - "--volume=${PWD}:/workspace:Z"
      - "--workdir=/workspace"

  # Ansible settings
  ansible:
    inventory:
      entries:
        - inventory/

  # Playbook run settings
  playbook-artifact:
    enable: true
    save-as: "{playbook_dir}/{playbook_name}-artifact-{time_stamp}.json"

  # Logging settings
  logging:
    level: debug
    append: false
    file: "./logs/ansible-navigator-{time_stamp}.log"

  # User Interface mode (interactive, stdout, or json)
  mode: interactive
