---
# Ansible Navigator Configuration
# Documentation: https://ansible-navigator.readthedocs.io/en/latest/settings/

ansible-navigator:

  # Execution Environment settings
  execution-environment:
    enabled: true
    container-engine: podman
    # Use the enhanced AIO EE with collection dependencies
    # image: localhost/ansible-aio-ee:latest
    image: ansible-minimal-ee:v0.0.1
    pull:
      policy: missing

  # Ansible settings
  ansible:
    inventory:
      entries:
        - inventory/

  # Playbook run settings
  playbook-artifact:
    enable: true
    save-as: "tmp/{playbook_name}-artifact-{time_stamp}.json"

  # Logging settings
  logging:
    level: debug
    append: false
    file: "./logs/ansible-navigator.log"

  # User Interface mode (interactive, stdout, or json)
  mode: interactive
