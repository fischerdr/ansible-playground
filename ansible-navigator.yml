---
# Ansible Navigator Configuration
# Documentation: https://ansible-navigator.readthedocs.io/en/latest/settings/

ansible-navigator:

  # Execution Environment settings
  execution-environment:
    enabled: true
    container-engine: podman
    image: quay.io/ansible/ansible-runner:latest
    pull:
      policy: missing

  # Ansible settings
  ansible:
    inventory:
      entries:
        - inventory/

  # Playbook run settings
  playbook-artifact:
    enable: true
    save-as: "{playbook_dir}/{playbook_name}-artifact-{time_stamp}.json"

  # Logging settings
  logging:
    level: debug
    append: false
    file: "./logs/ansible-navigator-{time_stamp}.log"

  # User Interface mode (interactive, stdout, or json)
  mode: interactive
