---
# Ansible Navigator Configuration
# Documentation: https://ansible-navigator.readthedocs.io/en/latest/settings/

ansible-navigator:
  # Execution Environment settings
  execution-environment:
    enabled: true
    container-engine: docker
    image: development-ee:latest
    pull:
      policy: missing

  # Ansible settings
  ansible:
    inventory:
      entries:
        - inventory/

  # Playbook run settings
  playbook-artifact:
    enable: false
    save-as: "{playbook_dir}/{playbook_name}-artifact-{time_stamp}.json"

  # Logging settings
  logging:
    level: info
    append: true
    file: "ansible-navigator.log"
