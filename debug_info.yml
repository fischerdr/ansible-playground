---
# Description: Display available Python libraries and Ansible collections

- name: Display Python and Ansible Environment Information
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Get current date
      ansible.builtin.command: date +%Y-%m-%d
      register: current_date
      changed_when: false
      no_log: false

    - name: Ensure tmp directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/tmp"
        state: directory
        mode: '0755'
      no_log: false

    - name: Get current user
      ansible.builtin.command: whoami
      register: current_user
      changed_when: false
      no_log: false

    - name: Get user home directory
      ansible.builtin.shell: echo $HOME
      register: user_home
      changed_when: false
      no_log: false

    - name: List user home directory contents
      ansible.builtin.shell: ls -la $HOME
      register: home_contents
      changed_when: false
      no_log: false

    - name: List current directory contents
      ansible.builtin.shell: ls -la $PWD
      register: pwd_contents
      changed_when: false
      no_log: false

    - name: Show current mount points
      ansible.builtin.command: mount
      register: mount_output
      changed_when: false
      no_log: false

    - name: Get Python Version and Path
      ansible.builtin.command: python3 --version
      register: python_version
      changed_when: false
      no_log: false

    - name: Get Python Path
      ansible.builtin.command: python3 -c "import sys; print('\n'.join(sys.path))"
      register: python_path
      changed_when: false
      no_log: false

    - name: List Installed Python Packages
      ansible.builtin.command: pip list
      register: pip_packages
      changed_when: false
      no_log: false

    - name: Get Ansible Version
      ansible.builtin.command: ansible --version
      register: my_ansible_version
      changed_when: false
      no_log: false

    - name: Show Ansible galaxy info
      ansible.builtin.command: ansible-galaxy --version
      register: ansible_galaxy_info
      changed_when: false
      no_log: false

    - name: List Installed Ansible Collections
      ansible.builtin.command: ansible-galaxy collection list
      register: ansible_collections
      changed_when: false
      no_log: false
      ignore_errors: true

    - name: Find all Python executables in common locations
      ansible.builtin.shell:
        cmd: find /usr/bin /usr/local/bin /opt /usr/local /opt/rh -name "python*" -type f -executable 2>/dev/null || true
      register: python_executables
      changed_when: false
      no_log: false

    - name: Get Python alternatives (Fedora)
      ansible.builtin.shell:
        cmd: alternatives --display python 2>/dev/null || true
      register: python_alternatives
      changed_when: false
      no_log: false

    - name: Get Python3 alternatives (Fedora)
      ansible.builtin.shell:
        cmd: alternatives --display python3 2>/dev/null || true
      register: python3_alternatives
      changed_when: false
      no_log: false

    - name: Check Python symlinks in common locations
      ansible.builtin.shell:
        cmd: |
          for dir in /usr/bin /usr/local/bin /opt /usr/local /opt/rh; do
            if [ -d "$dir" ]; then
              echo "=== $dir ==="
              ls -la $dir/python* 2>/dev/null || true
            fi
          done
      register: python_symlinks
      changed_when: false
      no_log: false

    - name: Get Python version from which command
      ansible.builtin.command: which python3
      register: python3_which
      changed_when: false
      no_log: false

    - name: Get Python version from which command (python)
      ansible.builtin.shell: |
        which python
      register: python_which
      changed_when: false
      no_log: false

    - name: Generate debug information
      ansible.builtin.set_fact:
        debug_info: |
          {{ '=' * 80 }}
          {{ 'USER INFORMATION' | center(80) }}
          {{ '=' * 80 }}

          {{ 'Current User:' | center(80) }}
          {{ current_user.stdout | center(80) }}

          {{ 'Home Directory:' | center(80) }}
          {{ user_home.stdout | center(80) }}

          {{ '=' * 80 }}
          {{ 'HOME DIRECTORY CONTENTS' | center(80) }}
          {{ '=' * 80 }}
          {% for item in home_contents.stdout_lines %}
          {{ item | center(80) }}
          {% endfor %}

          {{ '=' * 80 }}
          {{ 'PWD DIRECTORY CONTENTS' | center(80) }}
          {{ '=' * 80 }}
          {% for item in pwd_contents.stdout_lines %}
          {{ item | center(80) }}
          {% endfor %}

          {{ '=' * 80 }}
          {{ 'PYTHON ENVIRONMENT INFORMATION' | center(80) }}
          {{ '=' * 80 }}

          {{ 'Python Version:' | center(80) }}
          {{ python_version.stdout | center(80) }}

          {{ 'Python Path:' | center(80) }}
          {% for path in python_path.stdout_lines %}
          {{ path | center(80) }}
          {% endfor %}

          {{ '=' * 80 }}
          {{ 'PYTHON EXECUTABLE LOCATIONS' | center(80) }}
          {{ '=' * 80 }}
          {% if python3_which.stdout is defined and python3_which.stdout != "" %}
          {{ 'Python3 location:' | center(80) }}
          {{ python3_which.stdout | center(80) }}
          {% endif %}
          {% if python_which.stdout is defined and python_which.stdout != "" %}
          {{ 'Python location:' | center(80) }}
          {{ python_which.stdout | center(80) }}
          {% endif %}

          {{ '=' * 80 }}
          {{ 'INSTALLED PYTHON EXECUTABLES' | center(80) }}
          {{ '=' * 80 }}
          {% for exec in python_executables.stdout_lines %}
          {{ exec | center(80) }}
          {% endfor %}

          {{ '=' * 80 }}
          {{ 'PYTHON SYMLINKS' | center(80) }}
          {{ '=' * 80 }}
          {% if python_symlinks.stdout is defined and python_symlinks.stdout != "" %}
          {% for symlink in python_symlinks.stdout_lines %}
          {{ symlink | center(80) }}
          {% endfor %}
          {% else %}
          {{ 'No Python symlinks found in common locations' | center(80) }}
          {% endif %}

          {{ '=' * 80 }}
          {{ 'PYTHON ALTERNATIVES' | center(80) }}
          {{ '=' * 80 }}
          {% if python_alternatives.stdout is defined and python_alternatives.stdout != "" %}
          {{ 'Python Alternatives:' | center(80) }}
          {% for alt in python_alternatives.stdout_lines %}
          {{ alt | center(80) }}
          {% endfor %}
          {% else %}
          {{ 'No Python alternatives found' | center(80) }}
          {% endif %}

          {% if python3_alternatives.stdout is defined and python3_alternatives.stdout != "" %}
          {{ 'Python3 Alternatives:' | center(80) }}
          {% for alt in python3_alternatives.stdout_lines %}
          {{ alt | center(80) }}
          {% endfor %}
          {% else %}
          {{ 'No Python3 alternatives found' | center(80) }}
          {% endif %}

          {{ '=' * 80 }}
          {{ 'INSTALLED PYTHON PACKAGES' | center(80) }}
          {{ '=' * 80 }}
          {% for package in pip_packages.stdout_lines %}
          {{ package | center(80) }}
          {% endfor %}

          {{ '=' * 80 }}
          {{ 'ANSIBLE ENVIRONMENT INFORMATION' | center(80) }}
          {{ '=' * 80 }}

          {{ 'Ansible Version:' | center(80) }}
          {{ my_ansible_version.stdout_lines[0] | center(80) }}

          {{ 'Ansible Galaxy Version:' | center(80) }}
          {% for verinfo in ansible_galaxy_info.stdout_lines %}
          {{ verinfo | center(80) }}
          {% endfor %}

          {{ '=' * 80 }}
          {{ 'INSTALLED ANSIBLE COLLECTIONS' | center(80) }}
          {{ '=' * 80 }}
          {% for collection in ansible_collections.stdout_lines %}
          {{ collection | center(80) }}
          {% endfor %}
          {{ '=' * 80 }}

    - name: Write debug information to file
      ansible.builtin.copy:
        content: "{{ debug_info }}"
        dest: "{{ playbook_dir }}/../tmp/debug_info_{{ current_date.stdout }}.txt"
        mode: '0644'
      no_log: false

    - name: Display Environment Information
      ansible.builtin.debug:
        msg: "Debug information has been written to tmp/debug_info_{{ current_date.stdout }}.txt"
