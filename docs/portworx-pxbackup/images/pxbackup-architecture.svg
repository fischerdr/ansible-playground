<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">PXBackup High-Level Architecture</text>
  
  <!-- Central Management Plane -->
  <rect x="250" y="100" width="300" height="180" rx="10" ry="10" fill="#4472C4" fill-opacity="0.7" stroke="#2F528F" stroke-width="2" />
  <text x="400" y="125" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">Central Management Plane</text>
  
  <!-- Central Components -->
  <rect x="270" y="140" width="260" height="40" rx="5" ry="5" fill="#ffffff" stroke="#2F528F" stroke-width="1" />
  <text x="400" y="165" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">PX-Central UI</text>
  
  <rect x="270" y="190" width="260" height="40" rx="5" ry="5" fill="#ffffff" stroke="#2F528F" stroke-width="1" />
  <text x="400" y="215" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">PX-Central API Server</text>
  
  <rect x="270" y="240" width="260" height="30" rx="5" ry="5" fill="#ffffff" stroke="#2F528F" stroke-width="1" />
  <text x="400" y="260" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Metadata Database (MySQL)</text>
  
  <!-- Source Clusters -->
  <rect x="100" y="350" width="200" height="120" rx="10" ry="10" fill="#70AD47" fill-opacity="0.7" stroke="#507E32" stroke-width="2" />
  <text x="200" y="375" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Source Cluster 1</text>
  
  <rect x="120" y="390" width="160" height="30" rx="5" ry="5" fill="#ffffff" stroke="#507E32" stroke-width="1" />
  <text x="200" y="410" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Stork</text>
  
  <rect x="120" y="430" width="160" height="30" rx="5" ry="5" fill="#ffffff" stroke="#507E32" stroke-width="1" />
  <text x="200" y="450" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Kubernetes Applications</text>
  
  <rect x="330" y="350" width="200" height="120" rx="10" ry="10" fill="#70AD47" fill-opacity="0.7" stroke="#507E32" stroke-width="2" />
  <text x="430" y="375" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Source Cluster 2</text>
  
  <rect x="350" y="390" width="160" height="30" rx="5" ry="5" fill="#ffffff" stroke="#507E32" stroke-width="1" />
  <text x="430" y="410" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Stork</text>
  
  <rect x="350" y="430" width="160" height="30" rx="5" ry="5" fill="#ffffff" stroke="#507E32" stroke-width="1" />
  <text x="430" y="450" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Kubernetes Applications</text>
  
  <!-- Backup Target -->
  <rect x="560" y="350" width="200" height="120" rx="10" ry="10" fill="#ED7D31" fill-opacity="0.7" stroke="#AE5A21" stroke-width="2" />
  <text x="660" y="375" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Backup Targets</text>
  
  <rect x="580" y="390" width="160" height="30" rx="5" ry="5" fill="#ffffff" stroke="#AE5A21" stroke-width="1" />
  <text x="660" y="410" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">S3-Compatible Storage</text>
  
  <rect x="580" y="430" width="160" height="30" rx="5" ry="5" fill="#ffffff" stroke="#AE5A21" stroke-width="1" />
  <text x="660" y="450" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Volume Backups &amp; Metadata</text>
  
  <!-- Connections -->
  <!-- Central to Cluster 1 -->
  <path d="M 320 280 L 200 350" stroke="#333" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow)" />
  <text x="230" y="320" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Control API</text>
  
  <!-- Central to Cluster 2 -->
  <path d="M 400 280 L 400 350" stroke="#333" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow)" />
  <text x="410" y="320" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Control API</text>
  
  <!-- Cluster 1 to Storage -->
  <path d="M 300 410 L 580 410" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="440" y="400" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Backup Data Flow</text>
  
  <!-- Cluster 2 to Storage -->
  <path d="M 510 420 L 580 420" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  
  <!-- Central to Storage (metadata) -->
  <path d="M 480 220 L 660 350" stroke="#333" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow)" />
  <text x="580" y="290" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Metadata</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="100" y="500" width="20" height="20" fill="#4472C4" fill-opacity="0.7" stroke="#2F528F" stroke-width="1" />
  <text x="130" y="515" font-family="Arial" font-size="14" fill="#333">Central Management Plane</text>
  
  <rect x="100" y="530" width="20" height="20" fill="#70AD47" fill-opacity="0.7" stroke="#507E32" stroke-width="1" />
  <text x="130" y="545" font-family="Arial" font-size="14" fill="#333">Source Kubernetes Clusters</text>
  
  <rect x="400" y="500" width="20" height="20" fill="#ED7D31" fill-opacity="0.7" stroke="#AE5A21" stroke-width="1" />
  <text x="430" y="515" font-family="Arial" font-size="14" fill="#333">Backup Storage Targets</text>
  
  <line x1="400" y1="530" x2="450" y2="530" stroke="#333" stroke-width="2" stroke-dasharray="5,5" />
  <text x="480" y="535" font-family="Arial" font-size="14" fill="#333">Control Flow</text>
  
  <line x1="400" y1="550" x2="450" y2="550" stroke="#333" stroke-width="2" />
  <text x="480" y="555" font-family="Arial" font-size="14" fill="#333">Data Flow</text>
</svg> 