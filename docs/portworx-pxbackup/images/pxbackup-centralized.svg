<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">PXBackup Centralized Topology</text>
  
  <!-- Central PXBackup -->
  <rect x="300" y="100" width="200" height="120" rx="10" ry="10" fill="#4472C4" fill-opacity="0.7" stroke="#2F528F" stroke-width="2" />
  <text x="400" y="125" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">Central PXBackup</text>
  
  <rect x="320" y="140" width="160" height="30" rx="5" ry="5" fill="#ffffff" stroke="#2F528F" stroke-width="1" />
  <text x="400" y="160" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">UI &amp; API Server</text>
  
  <rect x="320" y="180" width="160" height="30" rx="5" ry="5" fill="#ffffff" stroke="#2F528F" stroke-width="1" />
  <text x="400" y="200" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Metadata Database</text>
  
  <!-- Source Clusters -->
  <rect x="100" y="300" width="140" height="80" rx="10" ry="10" fill="#70AD47" fill-opacity="0.7" stroke="#507E32" stroke-width="2" />
  <text x="170" y="325" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Cluster 1</text>
  <rect x="115" y="340" width="110" height="25" rx="5" ry="5" fill="#ffffff" stroke="#507E32" stroke-width="1" />
  <text x="170" y="357" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Stork</text>
  
  <rect x="260" y="300" width="140" height="80" rx="10" ry="10" fill="#70AD47" fill-opacity="0.7" stroke="#507E32" stroke-width="2" />
  <text x="330" y="325" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Cluster 2</text>
  <rect x="275" y="340" width="110" height="25" rx="5" ry="5" fill="#ffffff" stroke="#507E32" stroke-width="1" />
  <text x="330" y="357" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Stork</text>
  
  <rect x="420" y="300" width="140" height="80" rx="10" ry="10" fill="#70AD47" fill-opacity="0.7" stroke="#507E32" stroke-width="2" />
  <text x="490" y="325" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Cluster 3</text>
  <rect x="435" y="340" width="110" height="25" rx="5" ry="5" fill="#ffffff" stroke="#507E32" stroke-width="1" />
  <text x="490" y="357" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Stork</text>
  
  <rect x="580" y="300" width="140" height="80" rx="10" ry="10" fill="#70AD47" fill-opacity="0.7" stroke="#507E32" stroke-width="2" />
  <text x="650" y="325" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Cluster 4</text>
  <rect x="595" y="340" width="110" height="25" rx="5" ry="5" fill="#ffffff" stroke="#507E32" stroke-width="1" />
  <text x="650" y="357" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Stork</text>
  
  <!-- Object Storage -->
  <rect x="300" y="450" width="200" height="80" rx="10" ry="10" fill="#ED7D31" fill-opacity="0.7" stroke="#AE5A21" stroke-width="2" />
  <text x="400" y="475" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Object Storage</text>
  <rect x="320" y="490" width="160" height="30" rx="5" ry="5" fill="#ffffff" stroke="#AE5A21" stroke-width="1" />
  <text x="400" y="510" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">S3-Compatible Storage</text>
  
  <!-- Connections -->
  <!-- Central to Clusters -->
  <path d="M 330 220 L 170 300" stroke="#333" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow)" />
  <path d="M 370 220 L 330 300" stroke="#333" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow)" />
  <path d="M 430 220 L 490 300" stroke="#333" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow)" />
  <path d="M 470 220 L 650 300" stroke="#333" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow)" />
  
  <!-- Clusters to Storage -->
  <path d="M 170 380 L 350 450" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 330 380 L 380 450" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 490 380 L 420 450" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 650 380 L 450 450" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  
  <!-- Central to Storage (metadata) -->
  <path d="M 400 220 L 400 450" stroke="#333" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow)" />
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>
  
  <!-- Annotations -->
  <text x="250" y="250" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Control</text>
  <text x="550" y="250" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Control</text>
  <text x="430" y="410" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Backup Data</text>
  <text x="415" y="350" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Metadata</text>
  
  <!-- Features -->
  <rect x="600" y="430" width="140" height="120" rx="5" ry="5" fill="#F8F9FA" stroke="#DDD" stroke-width="1" />
  <text x="670" y="450" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Features</text>
  <text x="670" y="475" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">• Centralized Management</text>
  <text x="670" y="495" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">• Single UI/API Endpoint</text>
  <text x="670" y="515" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">• Unified Metadata</text>
  <text x="670" y="535" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">• Simplified Operations</text>
</svg> 