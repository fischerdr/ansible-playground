  <rect x="125" y="400" width="150" height="50" rx="10" ry="10" fill="#ED7D31" fill-opacity="0.7" stroke="#AE5A21" stroke-width="2" />
  <text x="200" y="425" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Regional Storage</text>
  <rect x="145" y="430" width="110" height="16" rx="5" ry="5" fill="#ffffff" stroke="#AE5A21" stroke-width="1" />
  <text x="200" y="443" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">S3-Compatible</text>
  
