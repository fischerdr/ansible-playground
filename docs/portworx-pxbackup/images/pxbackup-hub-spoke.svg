  <text x="200" y="290" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Local Metadata</text>
  
  <!-- Region 1 Clusters -->
  <rect x="80" y="320" width="80" height="60" rx="10" ry="10" fill="#70AD47" fill-opacity="0.7" stroke="#507E32" stroke-width="2" />
