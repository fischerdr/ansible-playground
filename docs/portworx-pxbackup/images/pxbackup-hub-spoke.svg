  <rect x="345" y="120" width="110" height="25" rx="5" ry="5" fill="#ffffff" stroke="#2F528F" stroke-width="1" />
  <text x="400" y="137" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">UI &amp; API Server</text>
  
  <rect x="345" y="150" width="110" height="25" rx="5" ry="5" fill="#ffffff" stroke="#2F528F" stroke-width="1" />
  <text x="400" y="167" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Global Metadata</text>
  
