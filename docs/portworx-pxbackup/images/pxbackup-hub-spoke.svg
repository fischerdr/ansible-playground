  <rect x="90" y="345" width="60" height="20" rx="5" ry="5" fill="#ffffff" stroke="#507E32" stroke-width="1" />
  <text x="120" y="360" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Stork</text>
  
  <rect x="170" y="320" width="80" height="60" rx="10" ry="10" fill="#70AD47" fill-opacity="0.7" stroke="#507E32" stroke-width="2" />
  <text x="210" y="340" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Cluster 2</text>
  <rect x="180" y="345" width="60" height="20" rx="5" ry="5" fill="#ffffff" stroke="#507E32" stroke-width="1" />
  <text x="210" y="360" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Stork</text>
  
