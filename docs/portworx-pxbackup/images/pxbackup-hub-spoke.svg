  <ellipse cx="600" cy="280" rx="170" ry="120" fill="#E1EFDA" stroke="#507E32" stroke-width="1" stroke-dasharray="5,5" />
  <text x="600" y="200" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#507E32">Region 2</text>
  
  <!-- Region 2 PXBackup -->
  <rect x="550" y="220" width="100" height="80" rx="10" ry="10" fill="#4472C4" fill-opacity="0.7" stroke="#2F528F" stroke-width="2" />
  <text x="600" y="240" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Regional Hub</text>
  
  <rect x="560" y="250" width="80" height="20" rx="5" ry="5" fill="#ffffff" stroke="#2F528F" stroke-width="1" />
  <text x="600" y="265" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Regional API</text>
  
  <rect x="560" y="275" width="80" height="20" rx="5" ry="5" fill="#ffffff" stroke="#2F528F" stroke-width="1" />
  <text x="600" y="290" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Local Metadata</text>
  
  <!-- Region 2 Clusters -->
  <rect x="480" y="320" width="80" height="60" rx="10" ry="10" fill="#70AD47" fill-opacity="0.7" stroke="#507E32" stroke-width="2" />
  <text x="520" y="340" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Cluster 3</text>
  <rect x="490" y="345" width="60" height="20" rx="5" ry="5" fill="#ffffff" stroke="#507E32" stroke-width="1" />
  <text x="520" y="360" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Stork</text>
  
  <rect x="570" y="320" width="80" height="60" rx="10" ry="10" fill="#70AD47" fill-opacity="0.7" stroke="#507E32" stroke-width="2" />
  <text x="610" y="340" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Cluster 4</text>
  <rect x="580" y="345" width="60" height="20" rx="5" ry="5" fill="#ffffff" stroke="#507E32" stroke-width="1" />
  <text x="610" y="360" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Stork</text>
  
  <rect x="660" y="320" width="80" height="60" rx="10" ry="10" fill="#70AD47" fill-opacity="0.7" stroke="#507E32" stroke-width="2" />
  <text x="700" y="340" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Cluster 5</text>
  <rect x="670" y="345" width="60" height="20" rx="5" ry="5" fill="#ffffff" stroke="#507E32" stroke-width="1" />
  <text x="700" y="360" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Stork</text>
  
  <!-- Region 2 Storage -->
  <rect x="525" y="400" width="150" height="50" rx="10" ry="10" fill="#ED7D31" fill-opacity="0.7" stroke="#AE5A21" stroke-width="2" />
  <text x="600" y="425" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Regional Storage</text>
  <rect x="545" y="430" width="110" height="16" rx="5" ry="5" fill="#ffffff" stroke="#AE5A21" stroke-width="1" />
  <text x="600" y="443" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">S3-Compatible</text>
  
  <!-- Connections -->
  <!-- Global to Region 1 -->
  <path d="M 330 140 L 240 230" stroke="#333" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow)" />
  <text x="270" y="180" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Metadata Sync</text>
  
  <!-- Global to Region 2 -->
  <path d="M 470 140 L 560 230" stroke="#333" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow)" />
  <text x="530" y="180" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Metadata Sync</text>
  
  <!-- Region 1 to Clusters -->
  <path d="M 180 300 L 120 320" stroke="#333" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow)" />
  <path d="M 220 300 L 210 320" stroke="#333" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow)" />
  
  <!-- Region 2 to Clusters -->
  <path d="M 580 300 L 520 320" stroke="#333" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow)" />
  <path d="M 600 300 L 610 320" stroke="#333" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow)" />
  <path d="M 620 300 L 700 320" stroke="#333" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow)" />
  
  <!-- Region 1 Clusters to Storage -->
  <path d="M 120 380 L 180 400" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 210 380 L 200 400" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  
  <!-- Region 2 Clusters to Storage -->
  <path d="M 520 380 L 580 400" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 610 380 L 600 400" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 700 380 L 620 400" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  
  <!-- Region Hubs to Storage -->
  <path d="M 200 300 L 200 400" stroke="#333" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow)" />
  <path d="M 600 300 L 600 400" stroke="#333" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow)" />
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>
  
  <!-- Features -->
  <rect x="325" y="480" width="150" height="110" rx="5" ry="5" fill="#F8F9FA" stroke="#DDD" stroke-width="1" />
  <text x="400" y="500" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Features</text>
  <text x="400" y="520" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">• Regional Autonomy</text>
  <text x="400" y="540" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">• Reduced Latency</text>
  <text x="400" y="560" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">• Global Visibility</text>
  <text x="400" y="580" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">• Improved Resilience</text>
</svg> 