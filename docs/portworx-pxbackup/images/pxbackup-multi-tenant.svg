<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">PXBackup Multi-Tenant Topology</text>
  
  <!-- Central PXBackup -->
  <rect x="300" y="70" width="200" height="150" rx="10" ry="10" fill="#4472C4" fill-opacity="0.7" stroke="#2F528F" stroke-width="2" />
  <text x="400" y="95" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">PXBackup Central</text>
  
  <rect x="320" y="110" width="160" height="30" rx="5" ry="5" fill="#ffffff" stroke="#2F528F" stroke-width="1" />
  <text x="400" y="130" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">UI &amp; API Server</text>
  
  <rect x="320" y="150" width="160" height="30" rx="5" ry="5" fill="#ffffff" stroke="#2F528F" stroke-width="1" />
  <text x="400" y="170" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Metadata Database</text>
  
  <rect x="320" y="190" width="160" height="20" rx="5" ry="5" fill="#ffffff" stroke="#2F528F" stroke-width="1" />
  <text x="400" y="205" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">RBAC Engine</text>
  
  <!-- Tenant 1 -->
  <rect x="100" y="230" width="200" height="330" rx="10" ry="10" fill="#DCE6F2" stroke="#2F528F" stroke-width="1" stroke-dasharray="5,5" />
  <text x="200" y="250" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#2F528F">Tenant A</text>
  
  <!-- Tenant 1 RBAC -->
  <rect x="125" y="265" width="150" height="40" rx="5" ry="5" fill="#F8F9FA" stroke="#2F528F" stroke-width="1" />
  <text x="200" y="285" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">RBAC Policy</text>
  <text x="200" y="300" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Tenant A Administrator</text>
  
  <!-- Tenant 1 Clusters -->
  <rect x="125" y="315" width="150" height="80" rx="10" ry="10" fill="#70AD47" fill-opacity="0.7" stroke="#507E32" stroke-width="2" />
  <text x="200" y="335" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Tenant A Clusters</text>
  
  <rect x="135" y="345" width="130" height="20" rx="5" ry="5" fill="#ffffff" stroke="#507E32" stroke-width="1" />
  <text x="200" y="360" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Development Cluster</text>
  
  <rect x="135" y="370" width="130" height="20" rx="5" ry="5" fill="#ffffff" stroke="#507E32" stroke-width="1" />
  <text x="200" y="385" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Production Cluster</text>
  
  <!-- Tenant 1 Storage -->
  <rect x="125" y="405" width="150" height="70" rx="10" ry="10" fill="#ED7D31" fill-opacity="0.7" stroke="#AE5A21" stroke-width="2" />
  <text x="200" y="425" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Tenant A Storage</text>
  
  <rect x="135" y="435" width="130" height="20" rx="5" ry="5" fill="#ffffff" stroke="#AE5A21" stroke-width="1" />
  <text x="200" y="450" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">S3 Bucket: tenant-a</text>
  
  <!-- Tenant 1 Users -->
  <rect x="125" y="485" width="150" height="65" rx="5" ry="5" fill="#F8F9FA" stroke="#2F528F" stroke-width="1" />
  <text x="200" y="505" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Tenant A Users</text>
  <text x="200" y="525" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">• Admin Team</text>
  <text x="200" y="540" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">• DevOps Team</text>
  
  <!-- Tenant 2 -->
  <rect x="500" y="230" width="200" height="330" rx="10" ry="10" fill="#EBF1DE" stroke="#507E32" stroke-width="1" stroke-dasharray="5,5" />
  <text x="600" y="250" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#507E32">Tenant B</text>
  
  <!-- Tenant 2 RBAC -->
  <rect x="525" y="265" width="150" height="40" rx="5" ry="5" fill="#F8F9FA" stroke="#507E32" stroke-width="1" />
  <text x="600" y="285" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">RBAC Policy</text>
  <text x="600" y="300" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Tenant B Administrator</text>
  
  <!-- Tenant 2 Clusters -->
  <rect x="525" y="315" width="150" height="120" rx="10" ry="10" fill="#70AD47" fill-opacity="0.7" stroke="#507E32" stroke-width="2" />
  <text x="600" y="335" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Tenant B Clusters</text>
  
  <rect x="535" y="345" width="130" height="20" rx="5" ry="5" fill="#ffffff" stroke="#507E32" stroke-width="1" />
  <text x="600" y="360" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Engineering Cluster</text>
  
  <rect x="535" y="370" width="130" height="20" rx="5" ry="5" fill="#ffffff" stroke="#507E32" stroke-width="1" />
  <text x="600" y="385" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Staging Cluster</text>
  
  <rect x="535" y="395" width="130" height="20" rx="5" ry="5" fill="#ffffff" stroke="#507E32" stroke-width="1" />
  <text x="600" y="410" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Production Cluster</text>
  
  <!-- Tenant 2 Storage -->
  <rect x="525" y="445" width="150" height="70" rx="10" ry="10" fill="#ED7D31" fill-opacity="0.7" stroke="#AE5A21" stroke-width="2" />
  <text x="600" y="465" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Tenant B Storage</text>
  
  <rect x="535" y="475" width="130" height="20" rx="5" ry="5" fill="#ffffff" stroke="#AE5A21" stroke-width="1" />
  <text x="600" y="490" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">S3 Bucket: tenant-b</text>
  
  <!-- Tenant 2 Users -->
  <rect x="525" y="525" width="150" height="25" rx="5" ry="5" fill="#F8F9FA" stroke="#507E32" stroke-width="1" />
  <text x="600" y="540" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">• Platform Team</text>
  
  <!-- Connections -->
  <!-- Central to Tenant 1 RBAC -->
  <path d="M 320 190 L 190 265" stroke="#333" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow)" />
  <text x="240" y="215" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Tenant A Permissions</text>
  
  <!-- Central to Tenant 2 RBAC -->
  <path d="M 480 190 L 580 265" stroke="#333" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow)" />
  <text x="550" y="215" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Tenant B Permissions</text>
  
  <!-- Tenant 1 RBAC to Clusters -->
  <path d="M 200 305 L 200 315" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  
  <!-- Tenant 2 RBAC to Clusters -->
  <path d="M 600 305 L 600 315" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  
  <!-- Tenant 1 Clusters to Storage -->
  <path d="M 200 395 L 200 405" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  
  <!-- Tenant 2 Clusters to Storage -->
  <path d="M 600 435 L 600 445" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>
  
  <!-- Central Feature List -->
  <rect x="320" y="280" width="160" height="130" rx="5" ry="5" fill="#F8F9FA" stroke="#DDD" stroke-width="1" />
  <text x="400" y="300" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Multi-Tenant Features</text>
  <text x="400" y="325" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">• Tenant Isolation</text>
  <text x="400" y="345" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">• Namespace Segregation</text>
  <text x="400" y="365" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">• Role-Based Access</text>
  <text x="400" y="385" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">• Storage Segregation</text>
  <text x="400" y="405" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">• Audit Trail Per Tenant</text>
</svg> 