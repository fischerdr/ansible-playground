---
- name: Map Namespaces to NFS PersistentVolumes and Assign Backup Labels
  hosts: localhost
  gather_facts: false
  vars:
    cluster_adm_kube_dir: "{{ playbook_dir | dirname }}/tmp/cache/kube_config"
    cluster: { "name":"cld-paas-d-eusw1c-4"}
    all_backup_schedules:
      - "all/pxbackup.portworx.io=4am"
      - "all/pxbackup.portworx.io=8am"
      - "all/pxbackup.portworx.io=12am"
      - "all/pxbackup.portworx.io=4pm"
      - "all/pxbackup.portworx.io=8pm"
      - "all/pxbackup.portworx.io=12pm"
    assigned_schedules: {}  # Initialize empty dictionary
    namespaces_with_pxbackup_default: []
    namespaces_using_nfs_pv: []
    namespaces_needing_all_label: []
    pv_to_ns_map: {}
    ns_to_pv_map: {}
    nfs_pvs: []

  tasks:
    - name: "Show Cluster"
      ansible.builtin.debug:
        msg: "Cluster {{ cluster.name }} Kube_adm_dir: {{ cluster_adm_kube_dir }}"

    # Read kubeconfig from file if it exists
    - name: Read kubeconfig from local file
      ansible.builtin.slurp:
        src: "{{ cluster_adm_kube_dir }}/{{ cluster.name }}.kubeconfig"
      register: local_kubeconfig_content
      no_log: true
      when: cluster_adm_kube_dir is defined and cluster_adm_kube_dir | length > 0 and lookup('ansible.builtin.fileglob', cluster_adm_kube_dir + '/' + cluster.name + '.kubeconfig') | length > 0

    # Set local file if found instead
    - name: Set kubeconfig from local file
      ansible.builtin.set_fact:
        kubeconfig_admin: "{{ local_kubeconfig_content.content | b64decode }}"
      no_log: true
      when: local_kubeconfig_content is defined and local_kubeconfig_content.content is defined

    - name: Get all PersistentVolumes
      kubernetes.core.k8s_info:
        api_version: v1
        kubeconfig: "{{ kubeconfig_admin | from_yaml }}"
        kind: PersistentVolume
      no_log: true
      register: pv_result

    - name: Get all PersistentVolumeClaims
      kubernetes.core.k8s_info:
        api_version: v1
        kubeconfig: "{{ kubeconfig_admin | from_yaml }}"
        kind: PersistentVolumeClaim
      register: pvc_result
      no_log: true

    - name: Get all namespaces with their labels
      kubernetes.core.k8s_info:
        api_version: v1
        kubeconfig: "{{ kubeconfig_admin | from_yaml }}"
        kind: Namespace
      register: namespace_result
      no_log: true

    - name: Filter NFS PVs
      ansible.builtin.set_fact:
        nfs_pvs: "{{ pv_result.resources | selectattr('spec.nfs', 'defined') | map(attribute='metadata.name') | list }}"
      no_log: true

    # Simplified approach - directly identify namespaces using NFS PVs
    - name: Find namespaces using NFS PVs
      ansible.builtin.set_fact:
        namespaces_using_nfs_pv: "{{ namespaces_using_nfs_pv + [item.metadata.namespace] }}"
      loop: "{{ pvc_result.resources }}"
      loop_control:
        label: "{{ item.metadata.namespace }}"
      no_log: true
      when: >
        item.spec.volumeName is defined and
        item.metadata.namespace is defined and
        item.spec.volumeName in nfs_pvs

    - name: Get all namespace names
      ansible.builtin.set_fact:
        all_namespaces: "{{ namespace_result.resources | map(attribute='metadata.name') | list }}"
      no_log: true

    - name: Filter out namespaces that use NFS PVs
      ansible.builtin.set_fact:
        namespaces_without_nfs_pv: "{{ all_namespaces | difference(namespaces_using_nfs_pv) }}"
      no_log: true

    - name: Display namespaces without NFS PVs
      ansible.builtin.debug:
        msg: |
          Namespaces without NFS PVs:
          {%- for ns in namespaces_without_nfs_pv %}

          - {{ ns }}
          {%- endfor %}

    - name: Filter namespaces with pxbackup=default label
      ansible.builtin.set_fact:
        namespaces_with_pxbackup_default: "{{ namespace_result.resources | selectattr('metadata.labels.pxbackup', 'defined') | selectattr('metadata.labels.pxbackup', 'equalto', 'default') | map(attribute='metadata.name') | list }}"
      no_log: true

    - name: Find namespaces needing all/pxbackup.portworx.io label
      ansible.builtin.set_fact:
        namespaces_needing_all_label: "{{ namespaces_needing_all_label + [item] }}"
      loop: "{{ namespaces_without_nfs_pv }}"
      when: >
        item in namespaces_with_pxbackup_default and
        (namespace_result.resources | selectattr('metadata.name', 'equalto', item) | first).metadata.labels is defined and
        'all/pxbackup.portworx.io' not in (namespace_result.resources | selectattr('metadata.name', 'equalto', item) | first).metadata.labels
      loop_control:
        label: "{{ item }}"
      no_log: true

    - name: Display namespaces needing all/pxbackup.portworx.io label
      ansible.builtin.debug:
        msg: |
          Namespaces needing all/pxbackup.portworx.io label:
          {%- for ns in namespaces_needing_all_label %}

          - {{ ns }}
          {%- endfor %}

    - name: Assign random backup schedule to namespaces
      ansible.builtin.set_fact:
        assigned_schedules: "{{ assigned_schedules | default({}) | combine({item: all_backup_schedules[item | hash('sha1') | int % all_backup_schedules | length]}) }}"
      loop: "{{ namespaces_needing_all_label }}"
      loop_control:
        label: "{{ item }}"
      no_log: true

    - name: Display assigned backup schedules
      ansible.builtin.debug:
        msg: |
          Assigned backup schedules:
          {%- for ns, schedule in assigned_schedules.items() %}

          - Namespace: {{ ns }} → Schedule: {{ schedule }}
          {%- endfor %}

