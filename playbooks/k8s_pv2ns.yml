---
- name: Map NFS PersistentVolumes to Namespaces
  hosts: localhost
  gather_facts: false
  vars:
    cluster_adm_kube_dir: "{{ playbook_dir | dirname }}/tmp/cache/kube_config"
    cluster: { "name":"cld-paas-d-eusw1c-4"}
    backup_schedules:
      - "resources/pxbackup.portworx.io=4am"
      - "resources/pxbackup.portworx.io=8am"
      - "resources/pxbackup.portworx.io=12am"
      - "resources/pxbackup.portworx.io=4pm"
      - "resources/pxbackup.portworx.io=8pm"
      - "resources/pxbackup.portworx.io=12pm"
    assigned_schedules: {}  # Initialize empty dictionary
    pxbackup_default_namespaces: []
    unique_namespaces: []
    namespaces_needing_schedule: []
    pv_to_ns_map: {}
    nfs_pvs: []
    nfs_pv_mapping: {}
    namespaces_with_all_label: []


  tasks:
    - name: "Show Cluster"
      ansible.builtin.debug:
        msg: "Cluster {{ cluster.name }} Kube_adm_dir: {{ cluster_adm_kube_dir }}"

    # Read kubeconfig from file if it exists
    - name: Read kubeconfig from local file
      ansible.builtin.slurp:
        src: "{{ cluster_adm_kube_dir }}/{{ cluster.name }}.kubeconfig"
      register: local_kubeconfig_content
      no_log: true
      when: cluster_adm_kube_dir is defined and cluster_adm_kube_dir | length > 0 and lookup('ansible.builtin.fileglob', cluster_adm_kube_dir + '/' + cluster.name + '.kubeconfig') | length > 0

    # Set local file if found instead
    - name: Set kubeconfig from local file
      ansible.builtin.set_fact:
        kubeconfig_admin: "{{ local_kubeconfig_content.content | b64decode }}"
      no_log: true
      when: local_kubeconfig_content is defined and local_kubeconfig_content.content is defined

    - name: Get all PersistentVolumes
      kubernetes.core.k8s_info:
        api_version: v1
        kubeconfig: "{{ kubeconfig_admin | from_yaml }}"
        kind: PersistentVolume
      no_log: true
      register: pv_result

    - name: Get all PersistentVolumeClaims
      kubernetes.core.k8s_info:
        api_version: v1
        kubeconfig: "{{ kubeconfig_admin | from_yaml }}"
        kind: PersistentVolumeClaim
      register: pvc_result
      no_log: true

    - name: Filter NFS PVs
      ansible.builtin.set_fact:
        nfs_pvs: "{{ pv_result.resources | selectattr('spec.nfs', 'defined') | map(attribute='metadata.name') | list }}"
      no_log: true

    # Simplified approach - directly map NFS PVs to namespaces
    - name: Map NFS PVs to their namespaces
      ansible.builtin.set_fact:
        nfs_pv_mapping: "{{ nfs_pv_mapping | combine({item.spec.volumeName: item.metadata.namespace}) }}"
      loop: "{{ pvc_result.resources }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      no_log: true
      when: >
        item.spec.volumeName is defined and 
        item.metadata.namespace is defined and
        item.spec.volumeName in nfs_pvs

    - name: Display Final Pretty Output
      ansible.builtin.debug:
        msg: |
          NFS PersistentVolumes Mapping:{%- for pv, ns in nfs_pv_mapping.items() %}
          - PV: {{ pv }} → Namespace: {{ ns }}{%- endfor %}

    - name: Get unique namespaces from NFS PV mapping
      ansible.builtin.set_fact:
        unique_namespaces: "{{ nfs_pv_mapping.values() | list | unique }}"
      no_log: true

    - name: Get all namespaces with their labels
      kubernetes.core.k8s_info:
        api_version: v1
        kubeconfig: "{{ kubeconfig_admin | from_yaml }}"
        kind: Namespace
      register: namespace_result
      no_log: true

    - name: Find namespaces without resources/pxbackup.portworx.io label
      ansible.builtin.set_fact:
        namespaces_needing_schedule: "{{ namespaces_needing_schedule + [item] }}"
      loop: "{{ unique_namespaces }}"
      when: >
        item != 'Unknown' and
        (namespace_result.resources | selectattr('metadata.name', 'equalto', item) | first).metadata.labels is defined and
        (namespace_result.resources | selectattr('metadata.name', 'equalto', item) | first).metadata.labels.pxbackup is defined and
        (namespace_result.resources | selectattr('metadata.name', 'equalto', item) | first).metadata.labels.pxbackup == 'default' and
        'resources/pxbackup.portworx.io' not in (namespace_result.resources | selectattr('metadata.name', 'equalto', item) | first).metadata.labels
      loop_control:
        label: "{{ item }}"
      no_log: true

    - name: Find namespaces with all/pxbackup.portworx.io label
      ansible.builtin.set_fact:
        namespaces_with_all_label: "{{ namespaces_with_all_label | default([]) + [item] }}"
      loop: "{{ unique_namespaces }}"
      when: >
        item != 'Unknown' and
        (namespace_result.resources | selectattr('metadata.name', 'equalto', item) | first).metadata.labels is defined and
        'all/pxbackup.portworx.io' in (namespace_result.resources | selectattr('metadata.name', 'equalto', item) | first).metadata.labels
      loop_control:
        label: "{{ item }}"
      no_log: true

    - name: Display namespaces with all/pxbackup.portworx.io label
      ansible.builtin.debug:
        msg: |
          Namespaces with all/pxbackup.portworx.io label:{%- for ns in namespaces_with_all_label | default([]) %}
          - {{ ns }}{%- endfor %}
      when: namespaces_with_all_label is defined and namespaces_with_all_label | length > 0

    # Uncomment the following task to remove the all/pxbackup.portworx.io label
    # - name: Remove all/pxbackup.portworx.io label from namespaces
    #   kubernetes.core.k8s:
    #     api_version: v1
    #     kubeconfig: "{{ kubeconfig_admin | from_yaml }}"
    #     kind: Namespace
    #     name: "{{ item }}"
    #     state: present
    #     merge_type: strategic-merge
    #     definition:
    #       metadata:
    #         labels:
    #           "all/pxbackup.portworx.io": null
    #   loop: "{{ namespaces_with_all_label | default([]) }}"
    #   loop_control:
    #     label: "{{ item }}"
    #   no_log: true
    #   when: namespaces_with_all_label is defined and namespaces_with_all_label | length > 0

    - name: Display namespaces needing backup schedule
      ansible.builtin.debug:
        msg: |
          Namespaces needing backup schedule:{%- for ns in namespaces_needing_schedule %}
          - {{ ns }}{%- endfor %}

    - name: Assign random backup schedule to namespaces
      ansible.builtin.set_fact:
        assigned_schedules: "{{ assigned_schedules | default({}) | combine({item: backup_schedules[item | hash('sha1') | int % backup_schedules | length]}) }}"
      loop: "{{ namespaces_needing_schedule }}"
      loop_control:
        label: "{{ item }}"
      no_log: true

    - name: Display assigned backup schedules
      ansible.builtin.debug:
        msg: |
          Assigned backup schedules:{%- for ns, schedule in assigned_schedules.items() %}
          - Namespace: {{ ns }} → Schedule: {{ schedule }}{%- endfor %}

    # Uncomment the following task to actually apply the labels to the namespaces
    # - name: Apply backup schedule labels to namespaces
    #   kubernetes.core.k8s:
    #     api_version: v1
    #     kubeconfig: "{{ kubeconfig_admin | from_yaml }}"
    #     kind: Namespace
    #     name: "{{ item.key }}"
    #     state: present
    #     merge_type: merge
    #     definition:
    #       metadata:
    #         labels:
    #           "{{ item.value.split('=')[0] }}": "{{ item.value.split('=')[1] }}"
    #   loop: "{{ assigned_schedules | dict2items }}"
    #   loop_control:
    #     label: "{{ item.key }}"
    #   no_log: true
