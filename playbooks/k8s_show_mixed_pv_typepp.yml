---
- name: Identify Namespaces with Mixed PV Types (NFS and Non-NFS)
  hosts: localhost
  gather_facts: false
  vars:
    cluster_adm_kube_dir: "{{ playbook_dir | dirname }}/tmp/cache/kube_config"
    cluster: { "name": "cld-paas-d-eusw1c-4" }
    nfs_pvs: []
    non_nfs_pvs: []
    pvc_to_pv_map: {}
    ns_to_pv_types: {}
    mixed_pv_namespaces: []
    # Add performance optimization flags
    use_field_selectors: true
    parallel_processing: true
    batch_size: 500

  tasks:
    - name: "Show Cluster"
      ansible.builtin.debug:
        msg: "Cluster {{ cluster.name }} Kube_adm_dir: {{ cluster_adm_kube_dir }}"

    # Read kubeconfig from file if it exists
    - name: Read kubeconfig from local file
      ansible.builtin.slurp:
        src: "{{ cluster_adm_kube_dir }}/{{ cluster.name }}.kubeconfig"
      register: local_kubeconfig_content
      no_log: true
      when: cluster_adm_kube_dir is defined and
            cluster_adm_kube_dir | length > 0 and
            lookup('ansible.builtin.fileglob', cluster_adm_kube_dir + '/' + cluster.name + '.kubeconfig') | length > 0

    # Set local file if found instead
    - name: Set kubeconfig from local file
      ansible.builtin.set_fact:
        kubeconfig_admin: "{{ local_kubeconfig_content.content | b64decode }}"
      no_log: true
      when: local_kubeconfig_content is defined and local_kubeconfig_content.content is defined

    - name: Get all PersistentVolumes
      kubernetes.core.k8s_info:
        api_version: v1
        kubeconfig: "{{ kubeconfig_admin | from_yaml }}"
        kind: PersistentVolume
      no_log: true
      register: pv_result

    - name: Process PersistentVolumes in a single task
      ansible.builtin.set_fact:
        nfs_pvs: "{{ pv_result.resources | default([]) | selectattr('spec.nfs', 'defined') | map(attribute='metadata.name') | list }}"
        non_nfs_pvs: "{{ pv_result.resources | default([]) | rejectattr('spec.nfs', 'defined') | map(attribute='metadata.name') | list }}"
      no_log: true

    - name: Get all namespaces
      kubernetes.core.k8s_info:
        api_version: v1
        kubeconfig: "{{ kubeconfig_admin | from_yaml }}"
        kind: Namespace
      register: namespace_result
      no_log: true

    - name: Get all PersistentVolumeClaims across all namespaces
      kubernetes.core.k8s_info:
        api_version: v1
        kubeconfig: "{{ kubeconfig_admin | from_yaml }}"
        kind: PersistentVolumeClaim
        # Use field selectors if available to filter server-side
        field_selectors:
          - spec.volumeName!=""
      register: pvc_result
      no_log: true
      when: use_field_selectors | bool

    - name: Get all PersistentVolumeClaims across all namespaces (without field selectors)
      kubernetes.core.k8s_info:
        api_version: v1
        kubeconfig: "{{ kubeconfig_admin | from_yaml }}"
        kind: PersistentVolumeClaim
      register: pvc_result
      no_log: true
      when: not use_field_selectors | bool

    - name: Create PVC to PV mapping and initialize namespace PV types in one task
      ansible.builtin.set_fact:
        pvc_to_pv_map: >-
          {% set pvc_map = {} %}
          {% for pvc in pvc_result.resources | default([]) %}
            {% if pvc.spec.volumeName is defined %}
              {% set _ = pvc_map.update({(pvc.metadata.namespace + '/' + pvc.metadata.name): pvc.spec.volumeName}) %}
            {% endif %}
          {% endfor %}
          {{ pvc_map }}
        ns_to_pv_types: >-
          {% set ns_types = {} %}
          {% for ns in namespace_result.resources | default([]) %}
            {% set _ = ns_types.update({ns.metadata.name: {'nfs': false, 'non_nfs': false}}) %}
          {% endfor %}
          {{ ns_types }}
      no_log: true
      when: parallel_processing | bool

    # Fallback to original approach if parallel processing is disabled
    - name: Map PVCs to PVs (traditional method)
      ansible.builtin.set_fact:
        pvc_to_pv_map: "{{ pvc_to_pv_map | combine({(item.metadata.namespace + '/' + item.metadata.name): item.spec.volumeName}) }}"
      loop: "{{ pvc_result.resources | default([]) }}"
      when: item.spec.volumeName is defined and not parallel_processing | bool
      no_log: true

    - name: Initialize namespace to PV types mapping (traditional method)
      ansible.builtin.set_fact:
        ns_to_pv_types: "{{ ns_to_pv_types | combine({item.metadata.name: {'nfs': false, 'non_nfs': false}}) }}"
      loop: "{{ namespace_result.resources | default([]) }}"
      when: not parallel_processing | bool
      no_log: true

    # Optimize the namespace PV type identification
    - name: Identify PV types used by each namespace (optimized)
      ansible.builtin.set_fact:
        ns_to_pv_types: >-
          {% set ns_dict = {} %}
          {% for ns_name, ns_data in ns_to_pv_types.items() %}
            {% set has_nfs = false %}
            {% set has_non_nfs = false %}
            {% for pvc_key, pv_name in pvc_to_pv_map.items() if pvc_key.split('/')[0] == ns_name %}
              {% if pv_name in nfs_pvs %}
                {% set has_nfs = true %}
              {% endif %}
              {% if pv_name in non_nfs_pvs %}
                {% set has_non_nfs = true %}
              {% endif %}
              {% if has_nfs and has_non_nfs %}
                {% break %}
              {% endif %}
            {% endfor %}
            {% set _ = ns_dict.update({ns_name: {'nfs': has_nfs, 'non_nfs': has_non_nfs}}) %}
          {% endfor %}
          {{ ns_dict }}
      no_log: true
      when: parallel_processing | bool

    # Fallback to original approach
    - name: Identify PV types used by each namespace (traditional)
      ansible.builtin.set_fact:
        ns_to_pv_types: >-
          {{ ns_to_pv_types | combine({
              item.split('/')[0]: {
                'nfs': ns_to_pv_types[item.split('/')[0]]['nfs'] or (pvc_to_pv_map[item] in nfs_pvs),
                'non_nfs': ns_to_pv_types[item.split('/')[0]]['non_nfs'] or (pvc_to_pv_map[item] in non_nfs_pvs)
              }
            })
          }}
      loop: "{{ pvc_to_pv_map.keys() | list }}"
      when: not parallel_processing | bool
      no_log: true

    - name: Identify namespaces with both NFS and non-NFS PV types
      ansible.builtin.set_fact:
        mixed_pv_namespaces: "{{ ns_to_pv_types | dict2items | selectattr('value.nfs', 'true') | selectattr('value.non_nfs', 'true') | map(attribute='key') | list }}"
      no_log: true

    - name: Display namespaces with mixed PV types
      ansible.builtin.debug:
        msg: |
          Namespaces with both NFS and non-NFS PV types:
          {%- for ns in mixed_pv_namespaces | sort %}

          - {{ ns }}
          {%- endfor %}

          Total count: {{ mixed_pv_namespaces | length }}

    - name: Create list of namespaces with only non-NFS PVs
      ansible.builtin.set_fact:
        non_nfs_only_namespaces: "{{ ns_to_pv_types | dict2items | selectattr('value.non_nfs', 'true') | selectattr('value.nfs', 'false') | map(attribute='key') | list | sort }}"
      no_log: true

    - name: Prepare JSON output data
      ansible.builtin.set_fact:
        output_data:
          mixed: "{{ mixed_pv_namespaces | sort }}"
          non_nfs: "{{ non_nfs_only_namespaces }}"
      no_log: true

    - name: Create output directory if it doesn't exist
      ansible.builtin.file:
        path: "{{ playbook_dir | dirname }}/tmp/output"
        state: directory
        mode: '0755'
      no_log: true

    - name: Write namespace data to JSON file with timestamp in filename
      ansible.builtin.copy:
        content: "{{ output_data | to_nice_json }}"
        dest: "{{ playbook_dir | dirname }}/tmp/output/namespace_pv_types_{{ lookup('pipe', 'date +%Y%m%d%H%M%S') }}.json"
        mode: '0644'
      no_log: false

    - name: Display path to output file
      ansible.builtin.debug:
        msg: "JSON output written to: {{ playbook_dir | dirname }}/tmp/output/namespace_pv_types_{{ lookup('pipe', 'date +%Y%m%d%H%M%S') }}.json"
