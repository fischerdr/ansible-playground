---
- name: Gather Kubernetes node names from Portworx pods
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Get nodes hosting Portworx pods
      ansible.builtin.command:
        cmd: >-
          kubectl get pods -l name=portworx -o jsonpath='{.items[*].spec.nodeName}'
      register: kube_nodes
      changed_when: false

    - name: Create dynamic inventory group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: "portworx_nodes"
      loop: "{{ kube_nodes.stdout.split() }}"
      when: kube_nodes.stdout != ""

- name: Check core and large log files on Portworx nodes
  hosts: portworx_nodes
  gather_facts: false
  vars:
    ssh_key_dir: "/path/to/ssh/keys"
    log_size_threshold_mb: 500
  tasks:
    - name: Set SSH identity file based on node name
      ansible.builtin.set_fact:
        ssh_key_file: "{{ ssh_key_dir }}/id_rsa_{{ inventory_hostname }}"

    - name: Check for core files
      ansible.builtin.find:
        paths: "/"
        patterns: "core.*"
        recurse: true
      register: core_files
      ignore_errors: true
      delegate_to: "{{ inventory_hostname }}"
      vars:
        ansible_ssh_common_args: "-i {{ ssh_key_file }}"

    - name: Check for large log files
      ansible.builtin.find:
        paths: "/var/log"
        patterns: "*.log"
        size: "{{ log_size_threshold_mb }}m"
        recurse: true
      register: large_log_files
      ignore_errors: true
      delegate_to: "{{ inventory_hostname }}"
      vars:
        ansible_ssh_common_args: "-i {{ ssh_key_file }}"

    - name: Report core files found
      ansible.builtin.debug:
        msg: "{{ core_files.files | map(attribute='path') | list }}"
      when: core_files.matched > 0

    - name: Report large log files found
      ansible.builtin.debug:
        msg: "{{ large_log_files.files | map(attribute='path') | list }}"
      when: large_log_files.matched > 0
