---
# Description: Lists all PX-Backup cloud credentials from the specified PX-Backup instance

- name: List and Display PX-Backup Cloud Credentials
  hosts: all
  gather_facts: false

  tasks:
    - name: Manage PX-Backup Cloud Credentials Operations
      block:
        - name: Validate Required Variables
          ansible.builtin.assert:
            that:
              - px_backup_api_url is defined
              - org_id is defined
            fail_msg: "Required variables are not set. Please ensure px_backup_api_url and org_id are defined."
            success_msg: "All required variables are properly set"

        - name: Login and Fetch PX-Backup Token
          ansible.builtin.include_role:
            name: common
            tasks_from: pxbkup_auth.yml

        - name: List All Cloud Credentials
          purepx.px_backup.cloud_credential:
            operation: INSPECT_ALL
            api_url: "{{ px_backup_api_url }}"
            token: "{{ px_backup_token }}"
            org_id: "{{ org_id }}"
            validate_certs: "{{ validate_certs | default(true) | bool }}"
            include_secrets: "{{ include_secrets | default(false) | bool }}"
          register: cloud_creds_result
          no_log: true  # Prevent token exposure in logs

        - name: Display Cloud Credentials Information
          ansible.builtin.debug:
            msg: |
              Total Cloud Credentials Found: {{ cloud_creds_result.cloud_credentials | length }}
              {% for cred in cloud_creds_result.cloud_credentials %}
              Cloud Credential {{ loop.index }}:
                Name: {{ cred.metadata.name }}
                UID: {{ cred.metadata.uid }}
                Type: {{ cred.cloud_credential_info.type | default('N/A') }}
                Created: {{ cred.metadata.create_time }}
              {% endfor %}
          when: not cloud_creds_result.failed

      rescue:
        - name: Log Error Details
          ansible.builtin.debug:
            msg: "Error occurred during PX-Backup operations: {{ ansible_failed_result }}"

        - name: Set Error Flag
          ansible.builtin.set_fact:
            px_backup_operation_failed: true

      always:
        - name: Cleanup Operations Status
          ansible.builtin.debug:
            msg: >-
              PX-Backup Cloud Credentials Operation completed.
              {% if px_backup_operation_failed | default(false) %}
              Status: Failed - Please check error details above
              {% else %}
              Status: Successful
              {% endif %}
