---
- name: Configure PX-Backup clusters
  hosts: all
  gather_facts: false

  tasks:
    - name: Validate Required Variables
      ansible.builtin.assert:
        that:
          - px_backup_api_url is defined
          - px_backup_api_url | string | length > 0
          - org_id is defined
          - org_id | string | length > 0
          - clusters is defined
          - clusters | length > 0
        fail_msg: "Required variables are not set. Please ensure all required variables are defined."
        success_msg: "All required variables are properly set"

    - name: Login and Fetch PX-Backup Token
      ansible.builtin.include_role:
        name: common
        tasks_from: pxbkup_auth.yml

    - name: Create PX-Backup clusters
      block:
        - name: Retrieve kubeconfig from Vault
          community.hashi_vault.vault_kv2_get:
            url: "{{ vault_address }}"
            namespace: "{{ vault_automation_default_namespace }}"
            path: "{{ vault_automation_config_path }}{{ item.name }}/{{ item.name }}.pxbkup"
            engine_mount_point: "{{ vault_automation_config_mount_point }}"
            auth_method: token
            token: "{{ vault_token }}"
            validate_certs: "{{ validate_certs }}"
            ca_cert: "{{ ca_cert_path }}"
          register: kubeconfig_data
          no_log: true
          loop: "{{ clusters }}"
          loop_control:
            label: "{{ item.name }}"
            index_var: cluster_idx

        - name: Validate kubeconfig data
          ansible.builtin.assert:
            that:
              - kubeconfig_data.results[cluster_idx].data.data.kubeconfig is defined
              - kubeconfig_data.results[cluster_idx].data.data.kubeconfig | string | length > 0
            fail_msg: "Failed to retrieve valid kubeconfig for cluster {{ item.name }}"
          loop: "{{ clusters }}"
          loop_control:
            label: "{{ item.name }}"
            index_var: cluster_idx
          no_log: true

        - name: Create cluster in PX-Backup
          purepx.px_backup.cluster:
            operation: CREATE
            api_url: "{{ px_backup_api_url }}"
            token: "{{ token_response.token }}"
            name: "{{ cluster.name }}"
            org_id: "{{ org_id | default('default') }}"
            cloud_type: "{{ cluster.cloud_type | default('OTHER') }}"
            kubeconfig: "{{ kubeconfig.data.data.kubeconfig | b64decode }}"
            cloud_credential_ref: "{{ cluster.cloud_credential_ref | default(omit) }}"
            platform_credential_ref: "{{ cluster.platform_credential_ref | default(omit) }}"
            px_config: "{{ cluster.px_config | default(omit) }}"
            service_token: "{{ cluster.service_token | default(omit) }}"
            validate_certs: "{{ validate_certs | default(true) }}"
          register: cluster_result
          no_log: true
          vars:
            cluster: "{{ item.0 }}"
            kubeconfig: "{{ item.1 }}"
          loop: "{{ clusters | zip(kubeconfig_data.results) | list }}"
          loop_control:
            label: "{{ item.0.name }}"

        - name: Log cluster creation details
          ansible.builtin.debug:
            msg:
              - "Cluster: {{ item.name }}"
              - "Status: {{ (cluster_result.results | selectattr('item.0.name', 'equalto', item.name) | first).changed | ternary('Created', 'Already exists') }}"
              - "Cloud Type: {{ item.cloud_type | default('OTHER') }}"
          loop: "{{ clusters }}"
          loop_control:
            label: "{{ item.name }}"
          when: not ansible_check_mode

      rescue:
        - name: Collect failed operations
          ansible.builtin.set_fact:
            failed_clusters: "{{ cluster_result.results | selectattr('failed', 'true') | map(attribute='item.0.name') | list }}"
            failure_messages: "{{ cluster_result.results | selectattr('failed', 'true') | map(attribute='msg') | list }}"
          when: cluster_result is defined and cluster_result.results is defined

        - name: Display error details
          ansible.builtin.debug:
            msg:
              - "Failed to create the following clusters:"
              - "Clusters: {{ failed_clusters | default([]) }}"
              - "Errors: {{ failure_messages | default([]) }}"
          when: failed_clusters is defined and failed_clusters | length > 0

        - name: Fail with error message
          ansible.builtin.fail:
            msg: "Failed to create {{ failed_clusters | length }} cluster(s). See above for details."
          when: failed_clusters is defined and failed_clusters | length > 0

    - name: Display creation results
      ansible.builtin.debug:
        msg:
          - "Successfully created clusters:"
          - "Clusters: {{ clusters | map(attribute='name') | list }}"
          - "Total clusters created: {{ clusters | length }}"
      when:
        - not ansible_check_mode
        - cluster_result is defined
        - not (cluster_result.results | selectattr('failed', 'true') | list | length > 0)
