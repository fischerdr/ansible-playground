---
# Description: Lists all PX-Backup clusters from the specified PX-Backup instance

- name: List and Display PX-Backup Clusters
  hosts: all
  gather_facts: false


  tasks:
    - name: Manage PX-Backup Cluster Operations
      block:
        - name: Validate Required Variables
          ansible.builtin.assert:
            that:
              - px_backup_api_url is defined
              - org_id is defined
            fail_msg: "Required variables are not set. Please ensure px_backup_api_url and org_id are defined."
            success_msg: "All required variables are properly set"

        - name: Login and Fetch PX-Backup Token
          ansible.builtin.include_role:
            name: common
            tasks_from: pxbkup_auth.yml

        - name: List All Clusters
          purepx.px_backup.cluster:
            operation: INSPECT_ALL
            api_url: "{{ px_backup_api_url }}"
            token: "{{ px_backup_token }}"
            org_id: "{{ org_id }}"
            validate_certs: "{{ validate_certs | bool }}"
          register: clusters_result
          no_log: true  # Prevent token exposure in logs

        - name: Display Clusters Information
          ansible.builtin.debug:
            msg: |
              Total Clusters Found: {{ clusters_result.clusters | length }}
              {% for cluster in clusters_result.clusters %}
              Cluster {{ loop.index }}:
                Name: {{ cluster.metadata.name }}
                UID: {{ cluster.metadata.uid }}
                Type: {{ cluster.cluster_info.type | default('N/A') }}
                Status: {{ cluster.cluster_info.status | default('N/A') }}
                Created: {{ cluster.metadata.create_time }}
              {% endfor %}
          when: not clusters_result.failed

      rescue:
        - name: Log Error Details
          ansible.builtin.debug:
            msg: "Error occurred during PX-Backup operations: {{ ansible_failed_result }}"

        - name: Set Error Flag
          ansible.builtin.set_fact:
            px_backup_operation_failed: true

      always:
        - name: Cleanup Operations Status
          ansible.builtin.debug:
            msg: >-
              PX-Backup Cluster Operation completed.
              {% if px_backup_operation_failed | default(false) %}
              Status: Failed - Please check error details above
              {% else %}
              Status: Successful
              {% endif %}
