- name: Update worker machineset for region us-west
  ansible.builtin.shell: "{{ working_dir }}/oc patch machineset {{ ms_item3 }} -n openshift-machine-api -p '{\"spec\": {\"template\": {\"spec\":{\"metadata\":{\"labels\":{\"topology.kubernetes.io/region\": \"us-west\"}}}}}}' --type=merge"
  loop: "{{ machineset_list.stdout_lines }}"
  loop_control:
    loop_var: ms_item3
  register: patch_machineset_region_west_result
  when: 'gloo_mesh_management is not defined and cluster_datacenter == "eusw1"'
  changed_when: patch_machineset_region_west_result.results | selectattr('rc', 'equalto', 0) | list | length > 0
  tags:
    - machineset
    - update
    - region

- name: Update worker machineset for region us-east
  ansible.builtin.shell: "{{ working_dir }}/oc patch machineset {{ ms_item4 }} -n openshift-machine-api -p '{\"spec\": {\"template\": {\"spec\":{\"metadata\":{\"labels\":{\"topology.kubernetes.io/region\": \"us-east\"}}}}}}' --type=merge"
  loop: "{{ machineset_list.stdout_lines }}"
  loop_control:
    loop_var: ms_item4
  register: patch_machineset_region_east_result
  when: 'gloo_mesh_management is not defined and cluster_datacenter == "euse1"'
  changed_when: patch_machineset_region_east_result.results | selectattr('rc', 'equalto', 0) | list | length > 0
  tags:
    - machineset
    - update
    - region

- name: Label worker machine
  ansible.builtin.shell:
    cmd: "set -o pipefail && {{ working_dir }}/oc get machine -n openshift-machine-api --no-headers | grep {{ cluster_hash }}-worker | grep -v 'worker-storage' | awk '{print $1}' | xargs {{ working_dir }}/oc patch machine -n openshift-machine-api -p '{\"spec\":{\"metadata\":{\"labels\":{\"tier\": \"app\", \"portworx.io/node-type\": \"storageless\", \"topology.kubernetes.io/zone\": \"{{ cluster_name }}\", \"size\": \"{{ node_size }}\"}}}}' --type=merge"
    executable: /bin/bash
  register: label_worker_result
  until: label_worker_result.rc == 0
  retries: "{{ retry_count | default(100) }}"
  delay: 30
  when: px_enabled | default(true) | bool and cluster_tenant != 'nemo' and cluster_tenant != 'pay'
  changed_when: label_worker_result.rc == 0
  tags:
    - machineset
    - label
    - portworx

- name: Label worker machine for non-portworx
  ansible.builtin.shell:
    cmd: "set -o pipefail && {{ working_dir }}/oc get machine -n openshift-machine-api --no-headers | grep {{ cluster_hash }}-worker | grep -v 'worker-storage' | awk '{print $1}' | xargs {{ working_dir }}/oc patch machine -n openshift-machine-api -p '{\"spec\":{\"metadata\":{\"labels\":{\"tier\": \"app\", \"px/enabled\": \"false\", \"topology.kubernetes.io/zone\": \"{{ cluster_name }}\", \"size\": \"{{ node_size }}\"}}}}' --type=merge"
    executable: /bin/bash
  register: label_worker_result
  until: label_worker_result.rc == 0
  retries: "{{ retry_count | default(100) }}"
  delay: 30
  when: not px_enabled | default(true) | bool or cluster_tenant == 'nemo' or cluster_tenant == 'pay'
  changed_when: label_worker_result.rc == 0
  tags:
    - machineset
    - label
    - non_portworx

