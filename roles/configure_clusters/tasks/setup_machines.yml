    executable: /bin/bash
  register: label_worker_result
  until: label_worker_result.rc == 0
  retries: "{{ retry_count | default(100) }}"
  delay: 30
  when: 'gloo_mesh_management is not defined and cluster_datacenter == "eusw1"'
  changed_when: label_worker_result.rc == 0
  tags:
    - machineset
    - label
    - region

- name: Label worker machine for region us-east
  ansible.builtin.shell:
    cmd: "set -o pipefail && {{ working_dir }}/oc get machine -n openshift-machine-api --no-headers | grep {{ cluster_hash }}-worker | awk '{print $1}' | xargs {{ working_dir }}/oc patch machine -n openshift-machine-api -p '{\"spec\":{\"metadata\":{\"labels\":{\"topology.kubernetes.io/region\": \"us-east\"}}}}' --type=merge"
    executable: /bin/bash
