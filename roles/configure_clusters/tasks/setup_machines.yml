- name: Label controlplane
  ansible.builtin.shell:
    cmd: "set -o pipefail && {{ working_dir }}/oc get machine -n openshift-machine-api --no-headers -l machine.openshift.io/cluster-api-machine-role=master | awk '{print $1}' | xargs {{ working_dir }}/oc patch machine -n openshift-machine-api -p '{\"spec\":{\"metadata\":{\"labels\":{\"px/enabled\": \"false\", \"tier\": \"controlplane\"}}}}' --type=merge"
    executable: /bin/bash
  register: label_cp_result
  until: label_cp_result.rc == 0
  retries: "{{ retry_count | default(100) }}"
  delay: 30
  changed_when: label_cp_result.rc == 0
  tags:
    - machineset
    - label
    - controlplane

- name: Set machineset group fact
  ansible.builtin.set_fact:
    machineset_group: "{{ machineset_group | regex_replace('^,', '') }},{{ ng_item.role }}"
  loop: "{{ cluster.spec.compute }}"
  loop_control:
    loop_var: ng_item
  when: "ng_item.role != 'worker'"
  tags:
    - machineset
    - facts

- name: Create machinesets
  ansible.builtin.include_role:
    name: create_machineset
  vars:
    node_group: "{{ machineset_group }}"
  tags:
    - machineset
    - create

- name: Schedule nodes
  ansible.builtin.include_role:
    name: schedule_nodes
  vars:
    node_group: "{{ machineset_group }}"
  when: not skip_schedule_nodes | default(false) | bool
  tags:
    - machineset
    - schedule

