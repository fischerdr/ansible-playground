---
- name: Get cluster hash
  ansible.builtin.shell:
    cmd: "set -o pipefail && {{ working_dir }}/oc get machine -n openshift-machine-api -l machine.openshift.io/cluster-api-machine-role=master -L machine.openshift.io/cluster-api-cluster -n openshift-machine-api --no-headers | awk '{print $NF}'"
    executable: /bin/bash
  register: result
  until: result.stdout_lines | length > 0
  retries: 100
  delay: 30
  changed_when: false
  tags:
    - machineset
    - cluster_hash

- name: Set cluster hash
  ansible.builtin.set_fact:
    cluster_hash: "{{ result.stdout_lines[0] }}"
  tags:
    - machineset
    - cluster_hash

- name: Get cpu count for worker
  ansible.builtin.command: "{{ working_dir }}/oc get machineset {{ cluster_hash }}-worker -n openshift-machine-api -o=custom-columns=:.spec.template.spec.providerSpec.value.numCPUs --no-headers"
  register: worker_cpu_result
  changed_when: false
  tags:
    - machineset
    - worker_cpu

- name: Set node size fact
  ansible.builtin.set_fact:
    node_size: >-
      {%- if  worker_cpu_result.stdout | int <= 32 -%}small
      {%- elif worker_cpu_result.stdout | int <= 48 -%}medium
      {%- elif worker_cpu_result.stdout | int <= 64 -%}large
      {%- else -%}xlarge
      {%- endif -%}
  tags:
    - machineset
    - node_size

- name: Get worker machinesets excluding storage
  ansible.builtin.shell: >-
    set -o pipefail &&
    {{ working_dir }}/oc get machineset -n openshift-machine-api --no-headers
    | grep worker
    | grep -v 'worker-storage'
    | awk '{print $1}'
  args:
    executable: /bin/bash
  register: machineset_list
  changed_when: machineset_list.stdout_lines | length == 0
  failed_when: machineset_list.rc not in [0, 1]
  tags:
    - machineset
    - list

- name: Update machineset worker
  ansible.builtin.shell: "{{ working_dir }}/oc patch machineset {{ ms_item1 }} -n openshift-machine-api -p '{\"spec\": {\"template\": {\"spec\":{\"metadata\":{\"labels\":{\"tier\": \"app\", \"portworx.io/node-type\": \"storageless\", \"topology.kubernetes.io/zone\": \"{{ cluster_name }}\", \"size\": \"{{ node_size }}\"}}}}}}' --type=merge"
  loop: "{{ machineset_list.stdout_lines }}"
  loop_control:
    loop_var: ms_item1
  register: patch_machineset_result
  when: px_enabled | default(true) | bool and cluster_tenant != 'nemo' and cluster_tenant != 'pay'
  changed_when: patch_machineset_result.results | selectattr('rc', 'equalto', 0) | list | length > 0
  tags:
    - machineset
    - update
    - portworx

- name: Update machineset worker for GPN
  ansible.builtin.shell: "{{ working_dir }}/oc patch machineset {{ ms_item1 }} -n openshift-machine-api -p '{\"spec\": {\"template\": {\"spec\":{\"metadata\":{\"labels\":{\"tier\": \"app\", \"px/enabled\": \"false\", \"topology.kubernetes.io/zone\": \"{{ cluster_name }}\", \"size\": \"{{ node_size }}\"}}}}}}' --type=merge"
  loop: "{{ machineset_list.stdout_lines }}"
  loop_control:
    loop_var: ms_item1
  register: patch_machineset_gpn_result
  when: not px_enabled | default(true) | bool or cluster_tenant == 'nemo' or cluster_tenant == 'pay'
  changed_when: patch_machineset_gpn_result.results | selectattr('rc', 'equalto', 0) | list | length > 0
  tags:
    - machineset
    - update
    - gpn

