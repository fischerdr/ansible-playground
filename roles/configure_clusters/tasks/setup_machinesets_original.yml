- name: Label worker machine for region us-west
  shell: "{{ working_dir }}/oc get machine -n openshift-machine-api --no-headers | grep {{ cluster_hash }}-worker | awk '{print $1}' | xargs {{ working_dir }}/oc patch machine -n openshift-machine-api -p '{\"spec\":{\"metadata\":{\"labels\":{\"topology.kubernetes.io/region\": \"us-west\"}}}}' --type=merge"
  register: label_worker_result
  until: label_worker_result.rc == 0
  retries: "{{ retry_count | default(100) }}"
  delay: 30
  when: 'gloo_mesh_management is not defined and cluster_datacenter == "eusw1"'

- name: Label worker machine for region us-east
  shell: "{{ working_dir }}/oc get machine -n openshift-machine-api --no-headers | grep {{ cluster_hash }}-worker | awk '{print $1}' | xargs {{ working_dir }}/oc patch machine -n openshift-machine-api -p '{\"spec\":{\"metadata\":{\"labels\":{\"topology.kubernetes.io/region\": \"us-east\"}}}}' --type=merge"
  register: label_worker_result_amp
  until: label_worker_result_amp.rc == 0
  retries: "{{ retry_count | default(100) }}"
