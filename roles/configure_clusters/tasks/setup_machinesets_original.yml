- name: Label controlplane
  shell: "{{ working_dir }}/oc get machine -n openshift-machine-api --no-headers -l machine.openshift.io/cluster-api-machine-role=master | awk '{print $1}' | xargs {{ working_dir }}/oc patch machine -n openshift-machine-api -p '{\"spec\":{\"metadata\":{\"labels\":{\"px/enabled\": \"false\", \"tier\": \"controlplane\"}}}}' --type=merge"
  register: label_cp_result
  until: label_cp_result.rc == 0
  retries: "{{ retry_count | default(100) }}"
  delay: 30

- set_fact:
    machineset_group: "{{ machineset_group | regex_replace('^,', '') }},{{ ng_item.role }}"
  when: "ng_item.role != 'worker'"
  with_items:
    - "{{ cluster.spec.compute }}"
  loop_control:
    loop_var: ng_item

- name: Create machinesets
  include_role:
    name: create_machineset
  vars:
    node_group: "{{ machineset_group }}"

- name: Schedule nodes
  include_role:
    name: schedule_nodes
  vars:
    node_group: "{{ machineset_group }}"
  when: not skip_schedule_nodes | default(False) | bool

