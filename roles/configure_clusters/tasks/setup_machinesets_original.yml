- name: Update worker machineset for region us-west
  shell: "{{ working_dir }}/oc patch machineset {{ ms_item3 }} -n openshift-machine-api -p '{\"spec\": {\"template\": {\"spec\":{\"metadata\":{\"labels\":{\"topology.kubernetes.io/region\": \"us-west\"}}}}}}' --type=merge"
  with_items: "{{ machineset_list.stdout_lines }}"
  when: 'gloo_mesh_management is not defined and cluster_datacenter == "eusw1"'
  loop_control:
    loop_var: ms_item3

- name: Update worker machineset for region us-east
  shell: "{{ working_dir }}/oc patch machineset {{ ms_item4 }} -n openshift-machine-api -p '{\"spec\": {\"template\": {\"spec\":{\"metadata\":{\"labels\":{\"topology.kubernetes.io/region\": \"us-east\"}}}}}}' --type=merge"
  with_items: "{{ machineset_list.stdout_lines }}"
  when: 'gloo_mesh_management is not defined and cluster_datacenter == "euse1"'
  loop_control:
    loop_var: ms_item4

- name: Label worker machine
  shell: "{{ working_dir }}/oc get machine -n openshift-machine-api --no-headers | grep {{ cluster_hash }}-worker | grep -v 'worker-storage' | awk '{print $1}' | xargs {{ working_dir }}/oc patch machine -n openshift-machine-api -p '{\"spec\":{\"metadata\":{\"labels\":{\"tier\": \"app\", \"portworx.io/node-type\": \"storageless\", \"topology.kubernetes.io/zone\": \"{{ cluster_name }}\", \"size\": \"{{ node_size }}\"}}}}' --type=merge"
  register: label_worker_result
  until: label_worker_result.rc == 0
  retries: "{{ retry_count | default(100) }}"
  delay: 30
  when: px_enabled | default(True) | bool and cluster_tenant != 'nemo' and cluster_tenant != 'pay'

- name: Label worker machine for non-portworx
