- name: Patch configs.samples.operator with its registry
  ansible.builtin.shell:
    cmd: >
      set -euo pipefail &&
      {{ OC_BIN }} patch configs.samples.operator.openshift.io cluster --type merge --patch '{"spec": {"samplesRegistry": "registry.redhat.io"}}'
    executable: /bin/bash
  register: patch_samples
  changed_when: "'patched' in (patch_samples.stdout | lower)"

- name: Patch OperatorHub to disable default CatalogSources
  ansible.builtin.shell:
    cmd: >
      set -euo pipefail &&
      {{ OC_BIN }} patch OperatorHub cluster --type json -p '[{"op": "add", "path": "/spec/disableAllDefaultSources", "value": true}]'
    executable: /bin/bash
  register: patch_operatorhub
  changed_when: "'patched' in (patch_operatorhub.stdout | lower)"
  # when: "'eus' in cluster_datacenter or cluster_env != 'p'"

- name: Pause for machineconfigpools to detect changes
  ansible.builtin.pause:
    seconds: 60

- name: Get machineconfigpools
  ansible.builtin.shell:
    cmd: >
      set -euo pipefail &&
      {{ OC_BIN }} get machineconfigpool --no-headers | wc -l
    executable: /bin/bash
  register: mcp_count
  changed_when: false

- name: Wait for machineconfigpool updates
  ansible.builtin.shell:
    cmd: >
      set -euo pipefail &&
      {{ OC_BIN }} get machineconfigpool | awk '$3 == "True"'
    executable: /bin/bash
  register: result
  changed_when: false
  until: result.stdout_lines | length == mcp_count.stdout | int
  retries: 100
  delay: 60

- name: Clean temporary files
  ansible.builtin.file:
    path: "{{ clean_item }}"
    state: absent
  loop:
    - "{{ working_dir }}/openshift-install"
    - "{{ working_dir }}/install-config.yaml"
    - "{{ working_dir }}/mirror_registry_config.yml"
  loop_control:
    loop_var: clean_item
