- name: Patch configs.samples.operator with its registry
  shell: "{{ OC_BIN }} patch configs.samples.operator.openshift.io cluster --type merge --patch '{\"spec\": {\"samplesRegistry\": \"registry.redhat.io\"}}'"

- name: Patch OperatorHub to disable default CatalogSources
  shell: "{{ OC_BIN }} patch OperatorHub cluster --type json -p '[{\"op\": \"add\", \"path\": \"/spec/disableAllDefaultSources\", \"value\": true}]'"
#  when: "'eus' in cluster_datacenter or cluster_env != 'p'"

- name: Pause for machineconfigpools to detect changes
  pause: seconds=60

- name: Get machineconfigpools
  shell: "{{ OC_BIN }} get machineconfigpool --no-headers | wc -l"
  register: mcp_count

- name: Wait for machineconfigpool updates
  shell: "{{ OC_BIN }} get machineconfigpool | awk '$3 == \"True\"'"
  register: result
  until: result.stdout_lines | length == mcp_count.stdout | int
  retries: 100
  delay: 60

- name: Clean temporary files
  file:
    path: "{{ clean_item }}"
    state: absent
  with_items:
    - "{{ working_dir }}/openshift-install"
    - "{{ working_dir }}/install-config.yaml"
    - "{{ working_dir }}/mirror_registry_config.yml"
  loop_control:
    loop_var: clean_item
