---
# hydra_thin_csi default variables
# These can be overridden by users.

# Core configuration
hydra_thin_csi_usecase: ""  # REQUIRED: LOGMONSHARED, ASTRO, or CUSTOMER
hydra_thin_csi_openshift_cluster_name: ""  # REQUIRED: OpenShift cluster identifier used in naming
hydra_thin_csi_vcenter_hostname: ""  # Optional: vCenter FQDN; derived from MachineSet workspace.server if empty
hydra_thin_csi_vcenter_datacenter: ""  # Optional: vCenter datacenter; derived from MachineSet workspace.datacenter if empty
hydra_thin_csi_lun_name: ""  # REQUIRED: Full datastore (LUN) name in vCenter
hydra_thin_csi_ds_cluster_name: ""  # REQUIRED: DS Cluster name in vCenter for this use case and cluster

# Feature flags
hydra_thin_csi_enable_verification: true
hydra_thin_csi_enable_reporting: true

# Reporting
hydra_thin_csi_report_format: "text"

# Vault integration (documentation only; do not store secrets here)
#
# The following secrets are expected to be provided by HashiCorp Vault using
# the community.hashi_vault.hashi_vault lookup plugin. Environment-specific
# Vault paths MUST be configured outside of this role (per environment/team
# standards). Example patterns only:
#
# - vCenter username/password: secret/hydra/vcenter
# - OpenShift API token / URL: secret/hydra/openshift
#
# This role never defines credential values directly; it only performs lookups.

# Optional knobs for Vault lookup composition (pattern only; exact values
# depend on environment and should be set in inventory or vars files).
hydra_thin_csi_vault_address: ""
hydra_thin_csi_vault_token: ""
hydra_thin_csi_vault_namespace: ""
hydra_thin_csi_vcenter_secret_path: "secret/hydra/vcenter"
hydra_thin_csi_ocp_secret_path: "secret/hydra/openshift"
