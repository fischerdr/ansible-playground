---
# Role: hydra_thin_csi
# Purpose: Configure thin-csi storage constructs for Hydra OpenShift clusters and vSphere vCenter.

- name: "PHASE 1: Pre-flight checks"
  ansible.builtin.import_tasks: preflight.yml
  tags:
    - always
    - preflight
    - hydra_thin_csi

- name: "PHASE 2: Input validation"
  ansible.builtin.import_tasks: validate.yml
  tags:
    - always
    - validation
    - hydra_thin_csi

- name: "PHASE 3: Execute configuration"
  ansible.builtin.import_tasks: execute.yml
  tags:
    - execution
    - hydra_thin_csi

- name: "PHASE 4: Verification (optional)"
  ansible.builtin.import_tasks: verify.yml
  when: hydra_thin_csi_enable_verification | default(true) | bool
  tags:
    - verification
    - hydra_thin_csi

- name: "PHASE 5: Reporting"
  ansible.builtin.import_tasks: report.yml
  when: hydra_thin_csi_enable_reporting | default(true) | bool
  tags:
    - reporting
    - hydra_thin_csi
