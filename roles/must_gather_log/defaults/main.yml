---
# Must-gather collection and upload configuration

# ==============================================================================
# OpenShift Version and Image Configuration
# ==============================================================================

# Must-gather version (e.g. "4.12", "4.14") - set via Vault/EE when needed
must_gather_version: "4.14"

# Dynamic mirror endpoint selection based on cloud provider
amex_mirror_endpoint: "{%- if aws.region is defined and aws.region != None -%}awsrepo.aexp.com{%- elif gcp.region is defined and gcp.region != None -%}gcprepo.aexp.com{%- elif azure.region is defined and azure.region != None -%}azurerepo.aexp.com{%- else -%}artifactory.aexp.com{%- endif -%}"

# ==============================================================================
# Directory Configuration (Managed Host)
# ==============================================================================

# Top-level output directory for must-gather artifacts
mustgather_output_dir: "{{ WORK_DIR | default('/tmp') }}/must-gather-{{ ansible_date_time.epoch }}"

# Subdirectory where must-gather actually writes collected data
# This is the directory that gets archived
mustgather_collection_dir: "{{ mustgather_output_dir }}/{{ cluster_name | default('cluster') }}-{{ ansible_date_time.epoch }}"

# Archive preservation directory for historical reference
mustgather_archive_dir: "{{ WORK_DIR | default('/tmp') }}/must-gather-archives"

# Upload logging directory for detailed upload logs
mustgather_upload_logs: "{{ WORK_DIR | default('/tmp') }}/must-gather-upload-logs"

# Archive retention policy
mustgather_archive_retention_days: 30  # Keep archives for 30 days (0 = keep forever)
mustgather_archive_retention_count: 10  # Keep last N archives (0 = unlimited)

# ==============================================================================
# Working Directory Retention Policy
# ==============================================================================

# Working directory retention for must-gather-<timestamp> directories
# These are the temporary collection directories (not the archived files)
mustgather_workdir_retention_days: 7  # Keep working directories for 7 days (0 = keep forever)

# NOTE: This is separate from archive retention
# - mustgather_workdir_retention_days: Controls must-gather-<timestamp>/ cleanup
# - mustgather_archive_retention_days: Controls must-gather-archives/*.tar.gz cleanup (already exists)

# ==============================================================================
# Operational Logging Configuration
# ==============================================================================

# Operational logging directory for must-gather operations
mustgather_operation_log_dir: "{{ WORK_DIR | default('/tmp') }}/must-gather-operation-logs"
mustgather_operation_log_file: "{{ mustgather_operation_log_dir }}/must-gather-operations-{{ ansible_date_time.epoch }}.log"

# ==============================================================================
# Red Hat Case Configuration
# ==============================================================================

# Red Hat case ID (OPTIONAL - if not provided, archives will only be collected locally without upload)
# When rh_case is provided: must-gather is collected AND uploaded to Red Hat support
# When rh_case is not provided: must-gather is collected ONLY and preserved locally
rh_case: ""

# ==============================================================================
# Node Selection Configuration
# ==============================================================================

# Label selector for must-gather node identification
mustgather_label_selector: "must_gather"
mustgather_label_value: "true"

# ==============================================================================
# Cleanup and Operational Controls
# ==============================================================================

# Set to true to preserve must-gather directories after execution
skip_mustgather_deletion: false

# ==============================================================================
# Red Hat SFTP Authentication (from HashiCorp Vault)
# ==============================================================================

# Red Hat SFTP authentication (sourced from HashiCorp Vault via lookup)
# Required for uploading must-gather archives to Red Hat support cases
#
# SFTP server details (per Red Hat documentation https://access.redhat.com/articles/5594481)
rh_sftp_host: "sftp.access.redhat.com"  # Red Hat SFTP server (port 22 or 80)
rh_sftp_user: ""  # Red Hat Customer Portal username
rh_sftp_token: ""  # SFTP authentication token (generate via web UI or API)
rh_sftp_vault_path: "static_secrets/data/env/{{ cluster_user | default('default') }}/redhat/serviceaccount"  # Vault path for SFTP credentials lookups

#
# Example lookup patterns for HashiCorp Vault:
#   rh_sftp_user: "{{ lookup('community.hashi_vault.hashi_vault', 'secret=secret/data/redhat:sftp_user') }}"
#   rh_sftp_token: "{{ lookup('community.hashi_vault.hashi_vault', 'secret=secret/data/redhat:sftp_token') }}"
#
# Generate SFTP token:
#   Web UI: https://access.redhat.com/support/secure-ftp
#   API: curl -X POST https://api.access.redhat.com/support/v2/sftp/token

# ==============================================================================
# SFTP Diagnostics
# ==============================================================================

# Enable verbose SSH/SFTP output (-vvv) in upload log files.
# WARNING: With large archives (multi-GB), this produces very large log files.
# Only enable when actively troubleshooting SFTP connection failures.
mustgather_sftp_verbose: false

# ==============================================================================
# Networking and Proxy Configuration
# ==============================================================================

# Proxy settings (optional - sourced from HashiCorp Vault or inventory)
# Used for SFTP connections via HTTP CONNECT proxy
# Example lookup pattern:
#   proxy_http: "{{ lookup('community.hashi_vault.hashi_vault', 'secret=secret/data/proxy:http_proxy') }}"
proxy_http: "http://proxy-appgw.aexp.com:9090"
proxy_https: "http://proxy-appgw.aexp.com:9090"
proxy_no: ".americanexpress.com,.aexp.com,localhost,127.0.0.1"

# ==============================================================================
# Red Hat SSO Device Authorization for SFTP Token Generation
# ==============================================================================

# Enable automatic SFTP token generation via OAuth2 device authorization flow
rh_sftp_token_auto_generate: false

# SFTP token expiry (30-90 days supported by Red Hat)
rh_sftp_token_expiry_days: 30

# Token expiry check threshold (days)
# Tokens expiring within this many days will be automatically refreshed
rh_sftp_token_refresh_threshold_days: 7

# Red Hat SSO and API endpoints
rh_sso_device_auth_endpoint: "https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/auth/device"
rh_sso_token_endpoint: "https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token"
rh_sftp_token_endpoint: "https://access.redhat.com/hydra/rest/v2/sftp/token"

# Red Hat account credentials (for device authorization)
# These are used ONLY if rh_sftp_token is not provided
# IMPORTANT: Red Hat account MUST NOT have 2FA enabled for automated approval
# Example: Source from Vault or extra_vars
#   rh_account_username: "{{ lookup('community.hashi_vault.hashi_vault', 'secret=secret/data/redhat:username') }}"
#   rh_account_password: "{{ lookup('community.hashi_vault.hashi_vault', 'secret=secret/data/redhat:password') }}"
rh_account_username: ""
rh_account_password: ""

# ==============================================================================
# HashiCorp Vault Integration for Token Storage
# ==============================================================================

# Enable storing generated SFTP tokens in Vault
vault_store_tokens: false

# Vault connection details (required if vault_store_tokens is true)
vault_addr: ""  # Example: "https://vault.example.com:8200"
vault_token: ""  # Vault authentication token
vault_namespace: ""  # Optional: Vault namespace (leave empty if not using namespaces)
vault_validate_certs: true

# Vault secret path configuration
vault_mount_path: "static_secrets"  # KV2 mount path
vault_secret_path: "env/{{ cluster_user | default('default') }}/redhat"  # Secret path within mount
