---
# Example group_vars/all/main.yml for must_gather_log role
#
# This file demonstrates how to configure the role using HashiCorp Vault lookups
# for sensitive credentials.
#
# Place this file in your inventory structure:
#   inventory/group_vars/all/main.yml
#
# Ensure VAULT_ADDR and VAULT_TOKEN (or other auth method) are configured

# ==============================================================================
# Red Hat SFTP Authentication from HashiCorp Vault
# ==============================================================================

# Red Hat Customer Portal username
rh_sftp_user: "{{ lookup('community.hashi_vault.hashi_vault',
                  'secret=secret/data/redhat:sftp_user') }}"

# Red Hat SFTP authentication token (time-limited, regenerate for each upload)
# Generate token: https://access.redhat.com/support/secure-ftp
rh_sftp_token: "{{ lookup('community.hashi_vault.hashi_vault',
                   'secret=secret/data/redhat:sftp_token') }}"

# ==============================================================================
# Proxy Configuration (Optional)
# ==============================================================================

# Retrieve proxy settings from Vault if your environment requires them
# Used for SFTP connections via HTTP CONNECT proxy tunneling
proxy_http: "{{ lookup('community.hashi_vault.hashi_vault',
             'secret=secret/data/proxy:http_proxy',
             default='') | default('', true) }}"

# ==============================================================================
# Vault Configuration (Optional Override)
# ==============================================================================

# If you need to override default Vault settings, uncomment and configure:
# vault_url: "https://vault.company.com:8200"
# vault_auth_method: "approle"  # or "token", "kubernetes", "aws", etc.

# For AppRole authentication:
# vault_role_id: "{{ lookup('env', 'VAULT_ROLE_ID') }}"
# vault_secret_id: "{{ lookup('env', 'VAULT_SECRET_ID') }}"

# ==============================================================================
# Alternative: Environment-Specific Vault Paths
# ==============================================================================

# For organizations with separate Vault paths per environment:
# vault_environment_path: "production"  # or "staging", "development"
#
# rh_sftp_user: "{{ lookup('community.hashi_vault.hashi_vault',
#                   'secret=secret/data/' + vault_environment_path + '/redhat:sftp_user') }}"
# rh_sftp_token: "{{ lookup('community.hashi_vault.hashi_vault',
#                    'secret=secret/data/' + vault_environment_path + '/redhat:sftp_token') }}"

# ==============================================================================
# Alternative: Vault Namespace Support (Vault Enterprise)
# ==============================================================================

# For Vault Enterprise with namespaces:
# vault_namespace: "engineering/automation"
#
# rh_sftp_user: "{{ lookup('community.hashi_vault.hashi_vault',
#                   'secret=secret/data/redhat:sftp_user
#                    namespace=' + vault_namespace) }}"
# rh_sftp_token: "{{ lookup('community.hashi_vault.hashi_vault',
#                    'secret=secret/data/redhat:sftp_token
#                     namespace=' + vault_namespace) }}"

# ==============================================================================
# Advanced: Lookup with Full Options
# ==============================================================================

# Example with all options specified:
# rh_sftp_user: "{{ lookup('community.hashi_vault.hashi_vault',
#                   'secret=secret/data/redhat:sftp_user',
#                   url='https://vault.company.com:8200',
#                   auth_method='approle',
#                   role_id=vault_role_id,
#                   secret_id=vault_secret_id,
#                   validate_certs=true,
#                   ca_cert='/etc/vault/ca.crt') }}"

# ==============================================================================
# Usage Notes
# ==============================================================================

# Vault Authentication:
#   Ensure one of the following is configured:
#   1. VAULT_TOKEN environment variable
#   2. VAULT_ROLE_ID and VAULT_SECRET_ID for AppRole
#   3. Kubernetes service account (for AAP in K8s)
#   4. AWS IAM credentials (for AAP on AWS)
#
# Testing Vault Connectivity:
#   # Manual test
#   vault kv get secret/redhat
#
#   # Ansible test
#   ansible localhost -m debug \
#     -a "msg={{ lookup('community.hashi_vault.hashi_vault', 'secret=secret/data/redhat:sftp_user') }}"
#
# Secrets Structure in Vault:
#   secret/data/redhat/
#     ├─ sftp_user: "username@example.com"
#     └─ sftp_token: "generated-sftp-token"
#
#   secret/data/proxy/
#     └─ http_proxy: "http://proxy.com:8080"
#
# SFTP Token Generation:
#   Tokens are time-limited and should be generated fresh for each upload
#   - Web UI: https://access.redhat.com/support/secure-ftp
#   - API: curl -X POST https://api.access.redhat.com/support/v2/sftp/token
#   - Store in Vault and rotate regularly
#
# Security:
#   - Never commit credentials to version control
#   - Use appropriate Vault policies to limit access
#   - Rotate SFTP tokens regularly (they are time-limited)
#   - Monitor Vault audit logs for access
#   - SFTP tokens are single-use and expire automatically
