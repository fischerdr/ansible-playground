---
galaxy_info:
  role_name: must_gather_log
  author: Enterprise Automation Team
  description: |
    Collect OpenShift must-gather diagnostics and upload to Red Hat support cases via SFTP.
    Features include automated collection, single archive creation with no file size limits,
    comprehensive SFTP logging, and collision-free multi-run support. Designed for Ansible
    Automation Platform execution environments.
  company: Internal
  license: Proprietary
  min_ansible_version: "2.15"

  platforms:
    - name: EL
      versions:
        - "8"
        - "9"
    - name: Fedora
      versions:
        - "38"
        - "39"
        - "40"
        - "41"

  galaxy_tags:
    - openshift
    - kubernetes
    - diagnostics
    - support
    - mustgather
    - redhat
    - troubleshooting
    - logging
    - automation
    - aap
    - sftp
    - upload

dependencies:
  - name: kubernetes.core
    version: ">=2.4.0"
