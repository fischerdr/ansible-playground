---
# ==============================================================================
# SFTP Credential Management Orchestrator
# ==============================================================================
# This file orchestrates the complete credential lifecycle:
# 1. Retrieve from Vault (if vault_parameters provided)
# 2. Check token expiry (if token exists)
# 3. Generate new token (if missing, expired, or force_refresh)
# 4. Store in Vault (if generated and vault_store_tokens enabled)
# 5. Validate credentials exist
# ==============================================================================

- name: "Retrieve SFTP credentials from Vault"
  ansible.builtin.include_tasks: vault_retrieve_sftp_credentials.yml
  when:
    - vault_parameters is defined
    - vault_parameters | string | length > 0
  tags:
    - redhat_sftp_token
    - vault_retrieval

- name: "Check token expiry"
  ansible.builtin.include_tasks: check_token_expiry.yml
  when:
    - rh_sftp_token is defined
    - rh_sftp_token | string | length > 0
    - _sftp_token_expiry is defined
    - _sftp_token_expiry | string | length > 0
  tags:
    - redhat_sftp_token
    - expiry_check

- name: "Determine if token generation is needed"
  ansible.builtin.set_fact:
    _generate_sftp_token: >-
      {{
        (rh_sftp_token_auto_generate | default(false) | bool) or
        (rh_sftp_token is not defined or rh_sftp_token | string | length == 0) or
        (_token_is_expired | default(false) | bool)
      }}
  tags:
    - redhat_sftp_token

- name: "Generate Red Hat SFTP token"
  ansible.builtin.include_tasks: redhat_sftp_token_generation.yml
  when: _generate_sftp_token | bool
  tags:
    - redhat_sftp_token
    - token_generation

- name: "Store generated token in Vault"
  ansible.builtin.include_tasks: vault_store_sftp_token.yml
  when:
    - _generate_sftp_token | bool
    - vault_store_tokens | default(false) | bool
  tags:
    - redhat_sftp_token
    - vault_storage

- name: "Validate SFTP credentials exist"
  ansible.builtin.assert:
    that:
      - rh_sftp_user is defined
      - rh_sftp_user | string | length > 0
      - rh_sftp_token is defined
      - rh_sftp_token | string | length > 0
    fail_msg: |
      SFTP credentials validation failed.
      Credentials must be provided via:
      1. Vault retrieval (vault_parameters)
      2. Auto-generation (rh_sftp_token_auto_generate: true)
      3. Extra vars (-e rh_sftp_user=... -e rh_sftp_token=...)
    success_msg: "SFTP credentials validated successfully"
  tags:
    - redhat_sftp_token
