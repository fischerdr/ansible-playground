---
# ==============================================================================
# Vault SFTP Credential Retrieval
# ==============================================================================
# Purpose: Retrieve SFTP credentials from HashiCorp Vault
# Input: vault_parameters (from setup_env role)
# Output: rh_sftp_user, rh_sftp_token, _sftp_token_expiry
# ==============================================================================

- name: Retrieve SFTP secret from Vault (single safe lookup)
  block:

    - name: Read secret from Vault (single call)
      ansible.builtin.set_fact:
        _sftp_secret: >-
          {{ lookup(
               'community.hashi_vault.hashi_vault',
               vault_parameters ~ ' secret=' ~ rh_sftp_vault_path,
               errors='ignore'
             ) | default({}, true) }}
      no_log: false
      tags:
        - redhat_sftp_token
        - vault_read

    - name: Extract SFTP credentials safely
      ansible.builtin.set_fact:
        rh_sftp_user: "{{ _sftp_secret.get('svc.user', '') | trim }}"
        rh_sftp_token: "{{ _sftp_secret.get('sftp_token', '') | trim }}"
        _sftp_token_expiry: "{{ _sftp_secret.get('sftp_token_expiry', '') | trim }}"
      no_log: false
      tags:
        - redhat_sftp_token
        - vault_parse

    - name: Display Vault retrieval success
      ansible.builtin.debug:
        msg: "Successfully retrieved SFTP credentials from Vault for user: {{ cluster_user | default('unknown') }}"
      tags:
        - redhat_sftp_token
        - vault_read

  rescue:

    - name: Log Vault retrieval failure (non-fatal)
      ansible.builtin.debug:
        msg: |
          INFO: Could not retrieve SFTP credentials from Vault.
          Path attempted: {{ rh_sftp_vault_path | default('undefined') }}
          Will attempt auto-generation if enabled.
