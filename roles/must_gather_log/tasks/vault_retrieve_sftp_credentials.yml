---
# ==============================================================================
# Vault SFTP Credential Retrieval
# ==============================================================================
# Purpose: Retrieve SFTP credentials from HashiCorp Vault
# Input: vault_parameters (from setup_env role)
# Output: rh_sftp_user, rh_sftp_token, _sftp_token_expiry
# ==============================================================================

- name: "Retrieve SFTP credentials from HashiCorp Vault"
  block:
    - name: "Retrieve credentials from Vault"
      ansible.builtin.set_fact:
        rh_sftp_user: "{{ lookup('community.hashi_vault.hashi_vault', vault_parameters ~ ' secret=static_secrets/data/env/' ~ cluster_user ~ '/redhat')['sftp_user'] | trim }}"
        rh_sftp_token: "{{ lookup('community.hashi_vault.hashi_vault', vault_parameters ~ ' secret=static_secrets/data/env/' ~ cluster_user ~ '/redhat')['sftp_token'] | trim }}"
        _sftp_token_expiry: "{{ lookup('community.hashi_vault.hashi_vault', vault_parameters ~ ' secret=static_secrets/data/env/' ~ cluster_user ~ '/redhat').get('sftp_token_expiry', '') | trim }}"
      no_log: true

    - name: "Display Vault retrieval success"
      ansible.builtin.debug:
        msg: "Successfully retrieved SFTP credentials from Vault for user: {{ cluster_user }}"

  rescue:
    - name: "Log Vault retrieval failure (non-fatal)"
      ansible.builtin.debug:
        msg: |
          INFO: Could not retrieve SFTP credentials from Vault.
          Path attempted: static_secrets/data/env/{{ cluster_user }}/redhat
          Will attempt auto-generation if enabled.
