---
# Phase: Verification
# Purpose: Confirm label propagation to all resources

- name: Verify MachineSet labels
  kubernetes.core.k8s_info:
    api_version: "machine.openshift.io/v1beta1"
    kind: MachineSet
    namespace: "{{ ocp_zone_label_updater_namespace }}"
    name: "{{ item.name }}"
  loop: "{{ ocp_zone_label_updater_zone_map }}"
  loop_control:
    label: "{{ item.name }}"
  register: __ocp_zone_label_updater_machineset_verify
  changed_when: false
  tags:
    - verify
    - ocp_zone_label_updater

- name: Assert MachineSet zone label present
  ansible.builtin.assert:
    that:
      - "'{{ ocp_zone_label_updater_label_key }}' in ms_result.resources[0].spec.template.spec.metadata.labels"
      - ms_result.resources[0].spec.template.spec.metadata.labels['{{ ocp_zone_label_updater_label_key }}'] == item.zone
    fail_msg: >
      ocp_zone_label_updater verification failed: MachineSet '{{ item.name }}'
      missing or incorrect zone label '{{ ocp_zone_label_updater_label_key }}={{ item.zone }}'.
      Expected label not found in spec.template.spec.metadata.labels.
  loop: "{{ ocp_zone_label_updater_zone_map }}"
  loop_control:
    label: "{{ item.name }}"
    index_var: ms_index
  vars:
    ms_result: "{{ __ocp_zone_label_updater_machineset_verify.results[ms_index] }}"
  tags:
    - verify
    - ocp_zone_label_updater

- name: Verify Machine labels
  kubernetes.core.k8s_info:
    api_version: "machine.openshift.io/v1beta1"
    kind: Machine
    namespace: "{{ ocp_zone_label_updater_namespace }}"
    name: "{{ item.machine_name }}"
  loop: "{{ ocp_zone_label_updater_valid_machines }}"
  loop_control:
    label: "{{ item.machine_name }}"
  register: __ocp_zone_label_updater_machine_verify
  changed_when: false
  tags:
    - verify
    - ocp_zone_label_updater

- name: Assert Machine zone label present
  ansible.builtin.assert:
    that:
      - "'{{ ocp_zone_label_updater_label_key }}' in machine_result.resources[0].spec.metadata.labels"
      - machine_result.resources[0].spec.metadata.labels['{{ ocp_zone_label_updater_label_key }}'] == item.zone
    fail_msg: >
      ocp_zone_label_updater verification failed: Machine '{{ item.machine_name }}'
      missing or incorrect zone label '{{ ocp_zone_label_updater_label_key }}={{ item.zone }}'.
      Expected label not found in spec.metadata.labels.
  loop: "{{ ocp_zone_label_updater_valid_machines }}"
  loop_control:
    label: "{{ item.machine_name }}"
    index_var: machine_index
  vars:
    machine_result: "{{ __ocp_zone_label_updater_machine_verify.results[machine_index] }}"
  tags:
    - verify
    - ocp_zone_label_updater

- name: Verify Node labels
  kubernetes.core.k8s_info:
    api_version: "v1"
    kind: Node
    name: "{{ item.node_name }}"
  loop: "{{ ocp_zone_label_updater_valid_machines }}"
  loop_control:
    label: "{{ item.node_name }}"
  register: __ocp_zone_label_updater_node_verify
  changed_when: false
  tags:
    - verify
    - ocp_zone_label_updater

- name: Assert Node zone label present
  ansible.builtin.assert:
    that:
      - "'{{ ocp_zone_label_updater_label_key }}' in node_result.resources[0].metadata.labels"
      - node_result.resources[0].metadata.labels['{{ ocp_zone_label_updater_label_key }}'] == item.zone
    fail_msg: >
      ocp_zone_label_updater verification failed: Node '{{ item.node_name }}'
      missing or incorrect zone label '{{ ocp_zone_label_updater_label_key }}={{ item.zone }}'.
      Expected label not found in metadata.labels.
  loop: "{{ ocp_zone_label_updater_valid_machines }}"
  loop_control:
    label: "{{ item.node_name }}"
    index_var: node_index
  vars:
    node_result: "{{ __ocp_zone_label_updater_node_verify.results[node_index] }}"
  tags:
    - verify
    - ocp_zone_label_updater
