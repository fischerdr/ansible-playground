---
# Validate node labels and configuration

- name: Get storage nodes directly from Kubernetes
  kubernetes.core.k8s_info:
    kind: Node
    label_selectors:
      - "{{ portworx_node_type_label }}=storage"
  register: portworx_storage_nodes_result

- name: Get storageless nodes directly from Kubernetes
  kubernetes.core.k8s_info:
    kind: Node
    label_selectors:
      - "{{ portworx_node_type_label }}=storageless"
  register: portworx_storageless_nodes_result

- name: Set node facts
  ansible.builtin.set_fact:
    portworx_storage_nodes: "{{ portworx_storage_nodes_result.resources }}"
    portworx_storageless_nodes: "{{ portworx_storageless_nodes_result.resources }}"
    portworx_storage_node_names: "{{ portworx_storage_nodes_result.resources | map(attribute='metadata.name') | list }}"
    portworx_storageless_node_names: "{{ portworx_storageless_nodes_result.resources | map(attribute='metadata.name') | list }}"
    portworx_storage_node_count: "{{ portworx_storage_nodes_result.resources | length }}"
    portworx_storageless_node_count: "{{ portworx_storageless_nodes_result.resources | length }}"
    portworx_total_node_count: "{{ (portworx_storage_nodes_result.resources | length) + (portworx_storageless_nodes_result.resources | length) }}"

- name: Display node counts
  ansible.builtin.debug:
    msg:
      - "Total Portworx nodes: {{ portworx_total_node_count }}"
      - "Storage nodes: {{ portworx_storage_node_count }}"
      - "Storageless nodes: {{ portworx_storageless_node_count }}"

- name: Validate minimum storage nodes
  ansible.builtin.assert:
    that:
      - portworx_storage_node_count | int >= 3
    fail_msg: "Minimum 3 storage nodes required, found {{ portworx_storage_node_count }}"
    success_msg: "Storage node count validated: {{ portworx_storage_node_count }}"

- name: Node label validation complete
  ansible.builtin.debug:
    msg: "All node labels validated successfully"
