---
# Simplified integration tests for node statistics validation logic
# Tests node counting by type and status from pxctl status output

- name: Test Node Statistics Validation Logic
  hosts: localhost
  gather_facts: false
  vars:
    portworx_target_version: "3.0.0"

  tasks:
    # Test Case 1 - All nodes healthy
    - name: Set mock pxctl status (healthy)
      ansible.builtin.set_fact:
        mock_lines:
          - "10.0.1.1        node1       worker-1    true    100GiB/500GiB  Online  3.0.0  5.14  RHEL"
          - "10.0.1.2        node2       worker-2    true    150GiB/500GiB  Online  3.0.0  5.14  RHEL"
          - "10.0.1.3        node3       worker-3    false   N/A            Online  3.0.0  5.14  RHEL"

    - name: Count nodes
      ansible.builtin.set_fact:
        total: "{{ mock_lines | select('match', '^[0-9]+\\.[0-9]+') | list | length }}"
        storage: "{{ mock_lines | select('match', '^[0-9]+\\.[0-9]+') | select('search', '\\s+true\\s+') | list | length }}"

    - name: Verify counts
      ansible.builtin.assert:
        that:
          - total | int == 3
          - storage | int == 2
        success_msg: "✅ PASS: Node counting works"

    - name: All tests passed
      ansible.builtin.debug:
        msg: "✅ All node statistics validation tests PASSED"
