---
# Debug timestamp parsing issue

- name: Debug timestamp parsing
  hosts: localhost
  gather_facts: true

  tasks:
    - name: Show current time
      ansible.builtin.debug:
        msg:
          - "ansible_date_time.epoch: {{ ansible_date_time.epoch }}"
          - "ansible_date_time.iso8601: {{ ansible_date_time.iso8601 }}"

    - name: Create timestamp 5 minutes ago
      ansible.builtin.set_fact:
        timestamp_5min_ago: "{{ '%Y-%m-%dT%H:%M:%SZ' | strftime(ansible_date_time.epoch | int - 300) }}"

    - name: Show the timestamp
      ansible.builtin.debug:
        msg: "Timestamp 5 min ago: {{ timestamp_5min_ago }}"

    - name: Test to_datetime parsing
      ansible.builtin.set_fact:
        parsed_datetime: "{{ timestamp_5min_ago | to_datetime('%Y-%m-%dT%H:%M:%SZ') }}"

    - name: Show parsed datetime
      ansible.builtin.debug:
        msg:
          - "Parsed datetime: {{ parsed_datetime }}"
          - "Parsed datetime type: {{ parsed_datetime | type_debug }}"

    - name: Test conversion to int
      ansible.builtin.set_fact:
        parsed_int: "{{ timestamp_5min_ago | to_datetime('%Y-%m-%dT%H:%M:%SZ') | int }}"

    - name: Show conversion
      ansible.builtin.debug:
        msg:
          - "Parsed as int: {{ parsed_int }}"
          - "Current epoch: {{ ansible_date_time.epoch }}"
          - "Difference: {{ (ansible_date_time.epoch | int) - (parsed_int | int) }}"

    - name: Alternative - strptime
      ansible.builtin.set_fact:
        pod_creation_time: "{{ ((timestamp_5min_ago | to_datetime('%Y-%m-%dT%H:%M:%SZ')).strftime('%s')) | int }}"

    - name: Show strptime result
      ansible.builtin.debug:
        msg:
          - "Pod creation time (strftime): {{ pod_creation_time }}"
          - "Current epoch: {{ ansible_date_time.epoch }}"
          - "Age in seconds: {{ (ansible_date_time.epoch | int) - pod_creation_time }}"
