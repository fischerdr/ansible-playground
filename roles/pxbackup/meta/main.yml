---
galaxy_info:
  role_name: pxbackup
  namespace: purepx
  author: Pure Storage, Inc.
  description: |
    Ansible role for managing PX-Backup cluster definitions and operations. This role provides comprehensive functionality for:
    - Service account creation and management in Kubernetes clusters
    - Secure kubeconfig generation and Vault storage integration
    - PX-Backup cluster registration and lifecycle management
    - Integration with Portworx backup API for backup operations
    - Support for both Docker and Podman container runtimes
    - Execution environment compatibility with ansible-runner and ansible-navigator
  company: Pure Storage
  license: Apache-2.0
  min_ansible_version: "2.15"  # Ensures modern Ansible features and security

  platforms:
    - name: EL  # Enterprise Linux (RHEL/CentOS Stream)
      versions:
        - "8"
        - "9"
    - name: Fedora
      versions:
        - "37"
        - "38"
        - "39"
        - "40"
        - "41"

  galaxy_tags:
    - pxbackup
    - kubernetes
    - backup
    - storage
    - portworx
    - containers
    - cloud
    - infrastructure
    - security
    - vault
    - ansiblerunner
    - ansiblenavigator
    - jinja2
    - purepx
    - automation
    - devops
    - sre

dependencies: []
