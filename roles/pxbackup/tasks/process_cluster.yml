---
# Tasks for processing individual clusters
- name: Configure cluster variables
  ansible.builtin.include_tasks:
    file: cluster_variables.yml

# First retrieve the master kubeconfig and create service account
- name: Retrieve Master Kubeconfig from Vault
  ansible.builtin.include_tasks:
    file: retrieve_master_kubeconfig.yml

# Create service account and kubeconfig for use in PX-Backup
- name: Create Service Account and Kubeconfig
  ansible.builtin.include_tasks:
    file: create_sa_kubeconfig.yml

# Then create the cluster in PX-Backup
- name: Create PX-Backup clusters
  block:
    - name: Retrieve kubeconfig from Vault
      community.hashi_vault.vault_kv2_get:
        url: "{{ vault_address }}"
        namespace: "{{ vault_automation_default_namespace }}"
        path: "{{ vault_automation_config_path }}{{ cluster.name }}/{{ cluster.name }}.pxbkup"
        engine_mount_point: "{{ vault_automation_config_mount_point }}"
        auth_method: token
        token: "{{ vault_token }}"
        validate_certs: "{{ validate_certs }}"
        ca_cert: "{{ ca_cert_path }}"
      register: kubeconfig_data
      no_log: true

    - name: Validate kubeconfig data
      ansible.builtin.assert:
        that:
          - kubeconfig_data.data.data.kubeconfig is defined
          - kubeconfig_data.data.data.kubeconfig | string | length > 0
        fail_msg: "Failed to retrieve valid kubeconfig for cluster {{ cluster.name }}"
      no_log: true

    - name: Check if cluster is already present and create/update
      block:
        - name: Get All Clusters
          purepx.px_backup.cluster:
            operation: INSPECT_ALL
            org_id: "{{ org_id }}"
            api_url: "{{ px_backup_api_url }}"
            token: "{{ px_backup_token }}"
            validate_certs: "{{ validate_certs | bool }}"
          register: px_clusters_list
          no_log: true  # Since response contains token

        - name: Create new cluster in PX-Backup
          purepx.px_backup.cluster:
            operation: CREATE
            api_url: "{{ px_backup_api_url }}"
            token: "{{ px_backup_token }}"
            name: "{{ cluster.name }}"
            org_id: "{{ org_id | default('default') }}"
            cloud_type: "{{ cluster.cloud_type | default('OTHER') }}"
            kubeconfig: "{{ kubeconfig_data.data.data.kubeconfig | b64decode }}"
            cloud_credential_ref: "{{ cluster.cloud_credential_ref | default(omit) }}"
            platform_credential_ref: "{{ cluster.platform_credential_ref | default(omit) }}"
            px_config: "{{ cluster.px_config | default(omit) }}"
            service_token: "{{ cluster.service_token | default(omit) }}"
            validate_certs: "{{ validate_certs | default(true) }}"
          register: cluster_creation
          no_log: true
          when: px_clusters_list.clusters | selectattr('metadata.name', 'equalto', cluster.name) | list | length == 0

        - name: Set existing cluster UID
          ansible.builtin.set_fact:
            existing_cluster_uid: "{{ (px_clusters_list.clusters | selectattr('metadata.name', 'equalto', cluster.name) | list | first).metadata.uid }}"
          when: px_clusters_list.clusters | selectattr('metadata.name', 'equalto', cluster.name) | list | length > 0
          no_log: true

        - name: Update existing cluster in PX-Backup
          purepx.px_backup.cluster:
            operation: UPDATE
            api_url: "{{ px_backup_api_url }}"
            token: "{{ px_backup_token }}"
            name: "{{ cluster.name }}"
            org_id: "{{ org_id | default('default') }}"
            uid: "{{ existing_cluster_uid }}"
            cloud_type: "{{ cluster.cloud_type | default('OTHER') }}"
            kubeconfig: "{{ kubeconfig_data.data.data.kubeconfig | b64decode }}"
            cloud_credential_ref: "{{ cluster.cloud_credential_ref | default(omit) }}"
            platform_credential_ref: "{{ cluster.platform_credential_ref | default(omit) }}"
            px_config: "{{ cluster.px_config | default(omit) }}"
            service_token: "{{ cluster.service_token | default(omit) }}"
            validate_certs: "{{ validate_certs | default(true) }}"
          register: cluster_update
          no_log: true
          when: px_clusters_list.clusters | selectattr('metadata.name', 'equalto', cluster.name) | list | length > 0

        - name: Set cluster operation status
          ansible.builtin.set_fact:
            cluster_status: >-
              {% if cluster_creation is defined and cluster_creation.changed | default(false) %}
              Created
              {% elif cluster_update is defined and cluster_update.changed | default(false) %}
              Updated
              {% else %}
              Unchanged
              {% endif %}

        - name: Verify cluster operation
          ansible.builtin.assert:
            that:
              - (cluster_creation is defined and cluster_creation is success) or
                (cluster_update is defined and cluster_update is success)
            fail_msg: "Failed to process cluster {{ cluster.name }} in PX-Backup"
            success_msg: "Successfully {{ cluster_status }} cluster {{ cluster.name }} in PX-Backup"

        - name: Log cluster operation details
          ansible.builtin.debug:
            msg:
              - "Cluster: {{ cluster.name }}"
              - "Status: {{ cluster_status }}"
              - "Cloud Type: {{ cluster.cloud_type | default('OTHER') }}"
              - "Organization: {{ org_id | default('default') }}"
              - "Cloud Credential: {{ cluster.cloud_credential_ref | default('None') }}"
              - "Platform Credential: {{ cluster.platform_credential_ref | default('None') }}"
            verbosity: 1
          when: not ansible_check_mode
          no_log: false

    # Create cluster backup schedules
    - name: Create Cluster Backup Schedules
      block:
        - name: Get All Clusters
          purepx.px_backup.cluster:
            operation: INSPECT_ALL
            org_id: "{{ org_id }}"
            api_url: "{{ px_backup_api_url }}"
            token: "{{ px_backup_token }}"
            validate_certs: "{{ validate_certs | bool }}"
          register: px_clusters_list
          no_log: true  # Since response contains token

        - name: Get Backup Locations
          purepx.px_backup.backup_location:
            operation: INSPECT_ALL
            org_id: "{{ org_id }}"
            api_url: "{{ px_backup_api_url }}"
            token: "{{ px_backup_token }}"
            validate_certs: "{{ validate_certs | bool }}"
          register: backup_locations_list
          no_log: true  # Since response contains token

        # Process schedule policies first
        - name: Process Schedule Policies
          ansible.builtin.include_tasks:
            file: setup_schedule_policies.yml
          when: schedule_policies is defined and schedule_policies | length > 0

        # Then process backup schedules
        - name: Initialize backup schedules results
          ansible.builtin.set_fact:
            backup_schedules_results: []
            backup_schedules_created: 0
            backup_schedules_updated: 0
            backup_schedules_unchanged: 0
          when: backup_schedules is defined and backup_schedules | length > 0

        - name: Process Each Backup Schedule
          ansible.builtin.include_tasks:
            file: setup_bkup_sched.yml
          loop: "{{ backup_schedules }}"
          loop_control:
            loop_var: schedule_item
            label: "{{ schedule_item.name }}"
          when: backup_schedules is defined and backup_schedules | length > 0

        - name: Display All Backup Schedules Results
          ansible.builtin.debug:
            msg: |
              Backup Schedules Summary for Cluster {{ cluster.name }}:
              Total: {{ backup_schedules | length }}
              Created: {{ backup_schedules_created }}
              Updated: {{ backup_schedules_updated }}
              Unchanged: {{ backup_schedules_unchanged }}
              
              Individual Schedule Results:
              {% for result in backup_schedules_results %}
              {{ result }}
              {% endfor %}
          when: not ansible_check_mode and backup_schedules is defined and backup_schedules | length > 0

  rescue:
    - name: Log cluster creation failure
      ansible.builtin.set_fact:
        cluster_error: >-
          Failed to create cluster {{ cluster.name }}:
          {% if kubeconfig_data is defined and kubeconfig_data.failed %}
          Failed to retrieve kubeconfig from Vault
          {% elif cluster_creation is defined and cluster_creation.failed %}
          {{ cluster_creation.msg }}
          {% elif cluster_update is defined and cluster_update.failed %}
          {{ cluster_update.msg }}
          {% else %}
          Unknown error occurred
          {% endif %}
      no_log: true

    - name: Debug cluster creation failure
      ansible.builtin.debug:
        msg: "{{ cluster_error }}"
        verbosity: 1

    - name: Record failed cluster
      ansible.builtin.set_fact:
        failed_clusters: "{{ failed_clusters | default([]) + [cluster.name] }}"

    - name: Fail task with error
      ansible.builtin.fail:
        msg: "{{ cluster_error }}"
      when: fail_on_cluster_error | default(true) | bool

  always:
    - name: Cleanup sensitive variables
      ansible.builtin.set_fact:
        kubeconfig_data: null
        cluster_creation: null
        cluster_update: null
      no_log: true
