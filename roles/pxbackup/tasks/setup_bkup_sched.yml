---

# Then add backup schedules to newly created cluster
- name: Validate Schedule Item
  ansible.builtin.assert:
    that:
      - schedule_item.name is defined
      - schedule_item.backup_location is defined
      - schedule_item.schedule_policy is defined
      - schedule_item.cluster is defined
    fail_msg: "Invalid schedule configuration for {{ schedule_item.name | default('unknown') }}"

- name: Get Schedule Policy Reference
  ansible.builtin.set_fact:
    schedule_policy_ref:
      name: "{{ selected_policy.metadata.name }}"
      uid: "{{ selected_policy.metadata.uid }}"
  vars:
    selected_policy: "{{ schedule_policies_list.schedule_policies | selectattr('metadata.name', 'equalto', schedule_item.schedule_policy) | list | first }}"
  failed_when: selected_policy | length == 0
  no_log: true

- name: Get Backup Location Reference
  ansible.builtin.set_fact:
    backup_location_ref:
      name: "{{ selected_location.metadata.name }}"
      uid: "{{ selected_location.metadata.uid }}"
  vars:
    selected_location: "{{ backup_locations_list.backup_locations | selectattr('metadata.name', 'equalto', schedule_item.backup_location) | list | first }}"
  failed_when: selected_location | length == 0
  no_log: true

- name: Get Cluster Reference
  ansible.builtin.set_fact:
    cluster_ref:
      name: "{{ selected_cluster.metadata.name }}"
      uid: "{{ selected_cluster.metadata.uid }}"
  vars:
    selected_cluster: "{{ px_clusters_list.clusters | selectattr('metadata.name', 'equalto', cluster.name) | list | first }}"
  failed_when: selected_cluster | length == 0
  no_log: true

- name: List All Backup Schedules
  purepx.px_backup.backup_schedule:
    operation: INSPECT_ALL
    api_url: "{{ px_backup_api_url }}"
    token: "{{ px_backup_token }}"
    org_id: "{{ org_id }}"
    validate_certs: "{{ validate_certs | bool }}"
  register: backup_schedules_result
  no_log: true  # Prevent token exposure in logs

- name: Check if backup schedule already exists
  ansible.builtin.set_fact:
    existing_schedule: "{{ backup_schedules_result.backup_schedules | selectattr('metadata.name', 'equalto', cluster.name ~ '-' ~ schedule_item.name) | list }}"
    schedule_exists: "{{ (backup_schedules_result.backup_schedules | selectattr('metadata.name', 'equalto', cluster.name ~ '-' ~ schedule_item.name) | list | length) > 0 }}"
  no_log: true

- name: Create Backup Schedule
  purepx.px_backup.backup_schedule:
    operation: CREATE
    api_url: "{{ px_backup_api_url }}"
    token: "{{ px_backup_token }}"
    validate_certs: "{{ validate_certs | bool }}"
    name: "{{ cluster.name }}-{{ schedule_item.name }}"
    org_id: "{{ org_id }}"
    reclaim_policy: "{{ schedule_item.reclaim_policy | default('Retain') }}"
    resource_types: "{{ schedule_item.resource_types | default(omit) }}"
    schedule_policy_ref: "{{ schedule_policy_ref }}"
    backup_location_ref: "{{ backup_location_ref }}"
    cluster_ref: "{{ cluster_ref }}"
    ns_label_selectors: "{{ schedule_item.ns_label_selectors | default(omit) }}"
    owner: "admin"
    # Optional parameters
    backup_type: "{{ schedule_item.backup_type | default('Normal') }}"
    suspend: "{{ schedule_item.suspend | default(false) }}"
    direct_kdmp: "{{ schedule_item.direct_kdmp | default(false) }}"
    skip_vm_auto_exec_rules: "{{ schedule_item.skip_vm_auto_exec_rules | default(false) }}"
    parallel_backup: "{{ schedule_item.parallel_backup | default(false) }}"
    keep_cr_status: "{{ schedule_item.keep_cr_status | default(false) }}"
    namespaces: "{{ schedule_item.namespaces | default(omit) }}"
    exclude_resource_types: "{{ schedule_item.exclude_resource_types | default(omit) }}"
    label_selectors: "{{ schedule_item.label_selectors | default(omit) }}"
    include_resources: "{{ schedule_item.include_resources | default(omit) }}"
    backup_object_type: "{{ schedule_item.backup_object_type | default(omit) }}"
    volume_snapshot_class_mapping: "{{ schedule_item.volume_snapshot_class_mapping | default(omit) }}"
    csi_snapshot_class_name: "{{ schedule_item.csi_snapshot_class_name | default(omit) }}"
    pre_exec_rule_ref: "{{ schedule_item.pre_exec_rule_ref | default(omit) }}"
    post_exec_rule_ref: "{{ schedule_item.post_exec_rule_ref | default(omit) }}"
    ownership: "{{ schedule_item.ownership | default(omit) }}"
  register: backup_result
  no_log: true  # Since response contains token
  when: not schedule_exists

- name: Update Existing Backup Schedule
  purepx.px_backup.backup_schedule:
    operation: UPDATE
    api_url: "{{ px_backup_api_url }}"
    token: "{{ px_backup_token }}"
    validate_certs: "{{ validate_certs | bool }}"
    name: "{{ cluster.name }}-{{ schedule_item.name }}"
    org_id: "{{ org_id }}"
    uid: "{{ existing_schedule[0].metadata.uid }}"
    reclaim_policy: "{{ schedule_item.reclaim_policy | default('Retain') }}"
    resource_types: "{{ schedule_item.resource_types | default(omit) }}"
    schedule_policy_ref: "{{ schedule_policy_ref }}"
    backup_location_ref: "{{ backup_location_ref }}"
    cluster_ref: "{{ cluster_ref }}"
    ns_label_selectors: "{{ schedule_item.ns_label_selectors | default(omit) }}"
    owner: "admin"
    # Optional parameters
    backup_type: "{{ schedule_item.backup_type | default('Normal') }}"
    suspend: "{{ schedule_item.suspend | default(false) }}"
    direct_kdmp: "{{ schedule_item.direct_kdmp | default(false) }}"
    skip_vm_auto_exec_rules: "{{ schedule_item.skip_vm_auto_exec_rules | default(false) }}"
    parallel_backup: "{{ schedule_item.parallel_backup | default(false) }}"
    keep_cr_status: "{{ schedule_item.keep_cr_status | default(false) }}"
    namespaces: "{{ schedule_item.namespaces | default(omit) }}"
    exclude_resource_types: "{{ schedule_item.exclude_resource_types | default(omit) }}"
    label_selectors: "{{ schedule_item.label_selectors | default(omit) }}"
    include_resources: "{{ schedule_item.include_resources | default(omit) }}"
    backup_object_type: "{{ schedule_item.backup_object_type | default(omit) }}"
    volume_snapshot_class_mapping: "{{ schedule_item.volume_snapshot_class_mapping | default(omit) }}"
    csi_snapshot_class_name: "{{ schedule_item.csi_snapshot_class_name | default(omit) }}"
    pre_exec_rule_ref: "{{ schedule_item.pre_exec_rule_ref | default(omit) }}"
    post_exec_rule_ref: "{{ schedule_item.post_exec_rule_ref | default(omit) }}"
    ownership: "{{ schedule_item.ownership | default(omit) }}"
  register: backup_update_result
  no_log: true  # Since response contains token
  when: schedule_exists

- name: Set backup operation status
  ansible.builtin.set_fact:
    backup_status: >-
      {% if backup_result is defined and backup_result.changed | default(false) %}
      Created
      {% elif backup_update_result is defined and backup_update_result.changed | default(false) %}
      Updated
      {% else %}
      Unchanged
      {% endif %}

- name: Update backup schedule counters
  ansible.builtin.set_fact:
    backup_schedules_created: "{{ backup_schedules_created | int + 1 if backup_status == 'Created' else backup_schedules_created | int }}"
    backup_schedules_updated: "{{ backup_schedules_updated | int + 1 if backup_status == 'Updated' else backup_schedules_updated | int }}"
    backup_schedules_unchanged: "{{ backup_schedules_unchanged | int + 1 if backup_status == 'Unchanged' else backup_schedules_unchanged | int }}"
  no_log: true

- name: Prepare schedule result message
  ansible.builtin.set_fact:
    schedule_result_message: >-
      Schedule {{ schedule_item.name }} ({{ backup_status }}):
      - Full Name: {{ cluster.name }}-{{ schedule_item.name }}
      - Schedule Policy: {{ schedule_policy_ref.name }}
      - Backup Location: {{ backup_location_ref.name }}
      {% if schedule_item.namespaces is defined %}
      - Namespaces: {{ schedule_item.namespaces | to_yaml }}
      {% endif %}
      {% if schedule_item.ns_label_selectors is defined %}
      - Namespace Label Selectors: {{ schedule_item.ns_label_selectors | to_yaml }}
      {% endif %}
  no_log: true

- name: Add schedule result to results list
  ansible.builtin.set_fact:
    backup_schedules_results: "{{ backup_schedules_results + [schedule_result_message] }}"
  no_log: true
