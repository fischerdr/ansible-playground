---
# Tasks for checking and managing schedule policies

- name: Initialize schedule policies results
  ansible.builtin.set_fact:
    schedule_policies_created: 0
    schedule_policies_updated: 0
    schedule_policies_unchanged: 0
    schedule_policies_results: []
  tags:
    - schedule_policies
    - variables

- name: Get All Schedule Policies
  purepx.px_backup.schedule_policy:
    operation: INSPECT_ALL
    org_id: "{{ org_id }}"
    api_url: "{{ px_backup_api_url }}"
    token: "{{ px_backup_token }}"
    validate_certs: "{{ validate_certs | bool }}"
  register: schedule_policies_list
  no_log: true  # Since response contains token
  tags:
    - schedule_policies
    - api_calls

- name: Validate Required Schedule Policies
  ansible.builtin.assert:
    that:
      - schedule_policies is defined
      - schedule_policies | length > 0
    fail_msg: "No schedule policies defined for cluster {{ cluster.name }}"
    success_msg: "Found {{ schedule_policies | length }} schedule policies to process"
  tags:
    - schedule_policies
    - validation

- name: Process Each Schedule Policy
  tags:
    - schedule_policies
    - policy_processing
  block:
    - name: Check if schedule policy exists
      ansible.builtin.set_fact:
        existing_policy: "{{ schedule_policies_list.schedule_policies | selectattr('metadata.name', 'equalto', policy_item.name) | list }}"
        policy_exists: "{{ (schedule_policies_list.schedule_policies | selectattr('metadata.name', 'equalto', policy_item.name) | list | length) > 0 }}"
      no_log: true
      tags:
        - schedule_policies
        - policy_check

    - name: Create New Schedule Policy
      purepx.px_backup.schedule_policy:
        operation: CREATE
        api_url: "{{ px_backup_api_url }}"
        token: "{{ px_backup_token }}"
        validate_certs: "{{ validate_certs | bool }}"
        name: "{{ policy_item.name }}"
        org_id: "{{ org_id }}"
        schedule_policy: "{{ policy_item.schedule_policy }}"
        labels: "{{ policy_item.labels | default(omit) }}"
        ownership: "{{ policy_item.ownership | default(omit) }}"
      register: policy_create_result
      no_log: true
      when: not policy_exists
      tags:
        - schedule_policies
        - policy_creation
        - api_calls

    - name: Update Existing Schedule Policy
      purepx.px_backup.schedule_policy:
        operation: UPDATE
        api_url: "{{ px_backup_api_url }}"
        token: "{{ px_backup_token }}"
        validate_certs: "{{ validate_certs | bool }}"
        name: "{{ policy_item.name }}"
        org_id: "{{ org_id }}"
        uid: "{{ existing_policy[0].metadata.uid }}"
        schedule_policy: "{{ policy_item.schedule_policy }}"
        labels: "{{ policy_item.labels | default(omit) }}"
        ownership: "{{ policy_item.ownership | default(omit) }}"
      register: policy_update_result
      no_log: true
      when: policy_exists
      tags:
        - schedule_policies
        - policy_update
        - api_calls

    - name: Set policy operation status
      ansible.builtin.set_fact:
        policy_status: >-
          {% if policy_create_result is defined and policy_create_result.changed | default(false) %}
          Created
          {% elif policy_update_result is defined and policy_update_result.changed | default(false) %}
          Updated
          {% else %}
          Unchanged
          {% endif %}
      tags:
        - schedule_policies
        - status

    - name: Update policy counters
      ansible.builtin.set_fact:
        schedule_policies_created: >-
          {{ schedule_policies_created | int + 1 if policy_status == 'Created'
          else schedule_policies_created | int }}
        schedule_policies_updated: >-
          {{ schedule_policies_updated | int + 1 if policy_status == 'Updated'
          else schedule_policies_updated | int }}
        schedule_policies_unchanged: >-
          {{ schedule_policies_unchanged | int + 1 if policy_status == 'Unchanged'
          else schedule_policies_unchanged | int }}
      no_log: true
      tags:
        - schedule_policies
        - status
        - reporting

    - name: Prepare policy result message
      ansible.builtin.set_fact:
        policy_result_message: >-
          Policy {{ policy_item.name }} ({{ policy_status }}):
          {% if policy_item.schedule_policy.interval is defined %}
          - Interval: Hourly / {{ policy_item.schedule_policy.interval.minutes | default(60) }} minutes
          - Retention: {{ policy_item.schedule_policy.interval.retain | default(24) }} backups
          {% elif policy_item.schedule_policy.daily is defined %}
          - Interval: Daily
          - Retention: {{ policy_item.schedule_policy.daily.retain | default(7) }} backups
          - Start Time: {{ policy_item.schedule_policy.daily.time | default('00:00') }}
          {% elif policy_item.schedule_policy.weekly is defined %}
          - Interval: Weekly ({{ policy_item.schedule_policy.weekly.day | default('Monday') }})
          - Retention: {{ policy_item.schedule_policy.weekly.retain | default(4) }} backups
          - Start Time: {{ policy_item.schedule_policy.weekly.time | default('00:00') }}
          {% elif policy_item.schedule_policy.monthly is defined %}
          - Interval: Monthly (Day {{ policy_item.schedule_policy.monthly.date | default(1) }})
          - Retention: {{ policy_item.schedule_policy.monthly.retain | default(12) }} backups
          - Start Time: {{ policy_item.schedule_policy.monthly.time | default('00:00') }}
          {% endif %}
      no_log: true
      tags:
        - schedule_policies
        - reporting

    - name: Add policy result to results list
      ansible.builtin.set_fact:
        schedule_policies_results: "{{ schedule_policies_results + [policy_result_message] }}"
      no_log: true
      tags:
        - schedule_policies
        - reporting

  rescue:
    - name: Log policy operation failure
      ansible.builtin.set_fact:
        policy_error: >-
          Failed to process schedule policy {{ policy_item.name }}:
          {% if policy_create_result is defined and policy_create_result.failed %}
          {{ policy_create_result.msg }}
          {% elif policy_update_result is defined and policy_update_result.failed %}
          {{ policy_update_result.msg }}
          {% else %}
          Unknown error occurred
          {% endif %}
      no_log: true
      tags:
        - schedule_policies
        - error_handling

    - name: Add failed policy to results
      ansible.builtin.set_fact:
        schedule_policies_results: >-
          {{ schedule_policies_results + ['Policy ' + policy_item.name + ' (FAILED): ' + policy_error] }}
      no_log: true
      tags:
        - schedule_policies
        - error_handling
        - reporting

  always:
    - name: Cleanup sensitive variables
      ansible.builtin.set_fact:
        policy_create_result: null
        policy_update_result: null
      no_log: true
      tags:
        - schedule_policies
        - cleanup
        - security

- name: Display Schedule Policies Summary
  ansible.builtin.debug:
    msg: |
      Schedule Policies Summary for Cluster {{ cluster.name }}:
      Total: {{ schedule_policies | length }}
      Created: {{ schedule_policies_created }}
      Updated: {{ schedule_policies_updated }}
      Unchanged: {{ schedule_policies_unchanged }}

      Individual Policy Results:
      {% for result in schedule_policies_results %}
      {{ result }}
      {% endfor %}
  when: not ansible_check_mode and schedule_policies | length > 0
  tags:
    - schedule_policies
    - reporting
    - debug
