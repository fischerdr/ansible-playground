---
# Tasks for verifying and creating backup locations if needed
- name: Get Existing Backup Locations
  tags:
    - backup_locations
    - api_calls
  purepx.px_backup.backup_location:
    operation: INSPECT_ALL
    org_id: "{{ org_id }}"
    api_url: "{{ px_backup_api_url }}"
    token: "{{ px_backup_token }}"
    validate_certs: "{{ validate_certs | bool }}"
  register: existing_backup_locations
  no_log: true  # Since response contains token

- name: Get Cloud Credentials
  tags:
    - backup_locations
    - api_calls
    - cloud_credentials
  purepx.px_backup.cloud_credential:
    operation: INSPECT_ALL
    org_id: "{{ org_id }}"
    api_url: "{{ px_backup_api_url }}"
    token: "{{ px_backup_token }}"
    validate_certs: "{{ validate_certs | bool }}"
  register: cloud_credentials_list
  no_log: true  # Since response contains token
  when: backup_locations is defined and backup_locations | length > 0

- name: Extract Existing Backup Location Names
  ansible.builtin.set_fact:
    existing_location_names: "{{ existing_backup_locations.backup_locations | map(attribute='metadata.name') | list }}"
  tags:
    - backup_locations
    - variables

- name: Extract Required Backup Locations from Backup Schedules
  ansible.builtin.set_fact:
    required_location_names: "{{ backup_schedules | map(attribute='backup_location') | unique | list }}"
  tags:
    - backup_locations
    - variables
  when:
    - backup_schedules is defined and backup_schedules | length > 0

- name: Use Defined Backup Locations if Available
  ansible.builtin.set_fact:
    required_location_names: "{{ backup_locations | map(attribute='name') | list }}"
    required_backup_locations: "{{ backup_locations }}"
  tags:
    - backup_locations
    - variables
  when: backup_locations is defined and backup_locations | length > 0

- name: Initialize updated backup locations
  ansible.builtin.set_fact:
    updated_backup_locations: []

- name: Update Cloud Credential References with UIDs
  ansible.builtin.set_fact:
    updated_backup_locations: "{{ updated_backup_locations + [item | combine({'cloud_credential_ref': {'cloud_credential_name': found_cred.metadata.name, 'cloud_credential_uid': found_cred.metadata.uid}})] }}"
  loop: "{{ required_backup_locations }}"
  vars:
    found_cred: >-
      {{
        (cloud_credentials_list.cloud_credentials | selectattr('metadata.name', 'equalto', item.cloud_cred_name) | list | first)
        if item.cloud_cred_name is defined else {}
      }}
  no_log: true
  when: found_cred != {}

- name: Finalize required_backup_locations
  ansible.builtin.set_fact:
    required_backup_locations: "{{ updated_backup_locations }}"
  no_log: true
  when: updated_backup_locations | length > 0

- name: Identify Missing Backup Locations
  ansible.builtin.set_fact:
    missing_backup_locations: "{{ required_location_names | difference(existing_location_names) }}"
  tags:
    - backup_locations
    - variables
  when: required_location_names is defined and required_location_names | length > 0

- name: Debug Missing Backup Locations
  ansible.builtin.debug:
    msg: "Missing backup locations that need to be created: {{ missing_backup_locations | default([]) }}"
    verbosity: 1
  tags:
    - backup_locations
    - debug
  when: missing_backup_locations is defined and missing_backup_locations | length > 0

- name: Fail if Missing Locations and No Backup Locations Defined
  ansible.builtin.fail:
    msg: "The following backup locations are required but not defined: {{ missing_backup_locations | join(', ') }}. Please define these locations in the backup_locations variable with their configuration details."
  when:
    - missing_backup_locations is defined and missing_backup_locations | length > 0
    - backup_locations is not defined or backup_locations | length == 0

- name: Filter Required Backup Locations to Only Missing Ones
  ansible.builtin.set_fact:
    locations_to_create: "{{ required_backup_locations | selectattr('name', 'in', missing_backup_locations) | list }}"
  tags:
    - backup_locations
    - variables
  when:
    - missing_backup_locations is defined and missing_backup_locations | length > 0
    - required_backup_locations is defined and required_backup_locations | length > 0

- name: Debug Locations to Create
  ansible.builtin.debug:
    var: locations_to_create
    verbosity: 2
  tags:
    - backup_locations
    - debug
  when: locations_to_create is defined and locations_to_create | length > 0

- name: Create Missing Backup Locations
  when: locations_to_create is defined and locations_to_create | length > 0
  block:
    - name: Create backup location
      tags:
        - backup_locations
        - api_calls
        - creation
      purepx.px_backup.backup_location:
        operation: CREATE
        api_url: "{{ px_backup_api_url }}"
        token: "{{ px_backup_token }}"
        name: "{{ item.name }}"
        org_id: "{{ org_id | default('default') }}"
        location_type: "{{ item.location_type }}"
        path: "{{ item.path }}"
        encryption_key: "{{ item.encryption_key | default(omit) }}"
        cloud_credential_ref: "{{ item.cloud_credential_ref | default(omit) }}"
        validate_cloud_credential: "{{ item.validate_cloud_credential | default(true) }}"
        object_lock_enabled: "{{ item.object_lock_enabled | default(false) }}"
        s3_config: "{{ item.s3_config | default(omit) }}"
        google_config: "{{ item.google_config | default(omit) }}"
        azure_config: "{{ item.azure_config | default(omit) }}"
        nfs_config: "{{ item.nfs_config | default(omit) }}"
        validate_certs: "{{ validate_certs | bool }}"
      loop: "{{ locations_to_create }}"
      register: backup_location_creation
      loop_control:
        label: "{{ item.name }}"


  rescue:
    - name: Display Backup Location Creation Errors
      ansible.builtin.debug:
        msg: "Failed to create backup locations: {{ backup_location_creation.results | selectattr('failed', 'defined') | selectattr('failed', 'true') | map(attribute='msg') | list }}"
      tags:
        - backup_locations
        - error_handling
        - debug
      when: backup_location_creation is defined and backup_location_creation.results is defined

    - name: Fail with Error Message
      ansible.builtin.fail:
        msg: "Failed to create required backup locations. See above for details."
      tags:
        - backup_locations
        - error_handling

- name: Display Backup Location Creation Results
  ansible.builtin.debug:
    msg:
      - "Successfully created backup locations:"
      - "Created locations: {{ backup_location_creation.results | map(attribute='item.name') | list }}"
    verbosity: 1
  tags:
    - backup_locations
    - reporting
    - debug
  when:
    - backup_location_creation is defined
    - backup_location_creation.results is defined
    - backup_location_creation.results | selectattr('failed', 'defined') | selectattr('failed', 'true') | list | length == 0
