---

- name: Reset cluster variables
  ansible.builtin.set_fact:
    cluster_user: null
    platform: null
    cluster_env: null
    region_zone: null
    region: null
    zone: null
    cluster_id: null
    cluster_has_zone: null
    parts: null
  tags:
    - always
    - cluster_setup
    - variables
    - cleanup

- name: Setup and validate cluster variables
  block:
    - name: Validate cluster name format
      ansible.builtin.assert:
        that:
          - cluster.name is defined
          - cluster.name is string
          - >
            cluster.name | regex_search('^[a-zA-Z0-9]+-[a-zA-Z0-9]+-[a-zA-Z0-9]+-[a-zA-Z0-9]+[abc]-[a-z0-9]+$') is not none or
            cluster.name | regex_search('^[a-zA-Z0-9]+-[a-zA-Z0-9]+-[a-zA-Z0-9]+-[a-zA-Z0-9]+-[a-z0-9]+$') is not none
        fail_msg: >
          "Invalid cluster name format. Expected formats:
           - With zone: <cluster_user>-<platform>-<env>-<region><zone>-<id>
           - Without zone: <cluster_user>-<platform>-<env>-<region>-<id>"
        success_msg: "Valid cluster name format"

    - name: Determine if cluster name has zone
      ansible.builtin.set_fact:
        cluster_has_zone: "{{ cluster.name | regex_search('^[a-zA-Z0-9]+-[a-zA-Z0-9]+-[a-zA-Z0-9]+-[a-zA-Z0-9]+[abc]-[a-z0-9]+$') is not none }}"

    - name: Define parts
      ansible.builtin.set_fact:
        parts: "{{ cluster.name.split('-') }}"
      no_log: false

    - name: Parse cluster name with zone
      ansible.builtin.set_fact:
        parts: "{{ cluster.name.split('-') }}"
        cluster_user: "{{ parts[0] }}"
        platform: "{{ parts[1] }}"
        cluster_env: >-
          {%- if parts[2] == 'p' -%}prod{%- elif parts[2] == 't' -%}test{%- elif parts[2] == 'd' -%}dev{%- else -%}{{ parts[2] }}{%- endif -%}
        region_zone: "{{ parts[3] }}"
        region: "{{ parts[3] | regex_replace('[abc]$', '') }}"
        zone: "{{ 'zone-' + (parts[3] | regex_search('[abc]$') | default('')) }}"
        cluster_id: "{{ parts[4] }}"
      when: cluster_has_zone | bool
      no_log: false  # Set to true if cluster name contains sensitive information

    - name: Parse cluster name without zone
      ansible.builtin.set_fact:
        parts: "{{ cluster.name.split('-') }}"
        cluster_user: "{{ parts[0] }}"
        platform: "{{ parts[1] }}"
        cluster_env: >-
          {%- if parts[2] == 'p' -%}prod{%- elif parts[2] == 't' -%}test{%- elif parts[2] == 'd' -%}dev{%- else -%}{{ parts[2] }}{%- endif -%}
        region: "{{ parts[3] }}"
        zone: "all-zones"
        cluster_id: "{{ parts[4] }}"
      when: not cluster_has_zone | bool
      no_log: false  # Set to true if cluster name contains sensitive information

    - name: Log extracted cluster information
      ansible.builtin.debug:
        verbosity: 1
        msg:
          - "Cluster User: {{ cluster_user }}"
          - "Platform: {{ platform }}"
          - "Environment: {{ cluster_env }}"
          - "Region: {{ region }}"
          - "Zone: {{ zone }}"
          - "Cluster ID: {{ cluster_id }}"

  rescue:
    - name: Handle cluster variable setup failure
      ansible.builtin.fail:
        msg: "Failed to setup cluster variables: {{ ansible_failed_result.msg | default('Unknown error') }}"

- name: "Get cluster info from inventory"
  ansible.builtin.uri:
    url: "{{ inventory_url }}/{{ cluster.name }}"
    method: GET
    return_content: true
    validate_certs: "{{ validate_certs }}"
    ca_path: "{{ ca_cert_path }}"
    headers:
      Accept: "application/json"
  register: inventory_response
  no_log: true

- name: "Set inventory region data"
  ansible.builtin.set_fact:
    region_data: "{{ inventory_response.json | community.general.json_query('region') }}"

- name: "Check if platform_vault exists in inventory response"
  ansible.builtin.set_fact:
    platform_vault_exists: "{{ (inventory_response.json | community.general.json_query('kubernetes_platform.secrets_management.platform_vault[0]') is not none) | bool }}"

- name: "Debug platform_vault existence"
  ansible.builtin.debug:
    var: platform_vault_exists
    verbosity: 1

- name: Check inventory for cluster vault information
  when: platform_vault_exists
  block:
    - name: "Set Vault configuration facts"
      ansible.builtin.set_fact:
        vault_address: "{{ inventory_response.json | community.general.json_query('kubernetes_platform.secrets_management.platform_vault[0].address') }}"
        vault_namespace: "{{ inventory_response.json | community.general.json_query('kubernetes_platform.secrets_management.platform_vault[0].namespace') }}"
        vault_default_path_full: "{{ inventory_response.json | community.general.json_query('kubernetes_platform.secrets_management.platform_vault[0].default_path') }}"

    - name: "Set Vault mount point and paths"
      ansible.builtin.set_fact:
        vault_mount_point: "{{ vault_default_path_full.split('/')[0] }}"
        vault_default_path: "{{ vault_default_path_full.split('/')[1:] | join('/') }}"

    - name: "Verify Vault configuration facts"
      ansible.builtin.debug:
        msg: |
          Vault Address: {{ vault_address }}
          Vault Namespace: {{ vault_namespace }}
          Vault Default Path (Full): {{ vault_default_path_full }}
          Vault Default Path (Clean): {{ vault_default_path }}
          Vault Mount Point: {{ vault_mount_point }}
          Vault Namespace: {{ vault_namespace }}

- name: Set vault information from defaults
  when: not platform_vault_exists
  block:
    - name: Setup Defaults based on cluster_env
      ansible.builtin.set_fact:
        vault_address: >-
          {%- if cluster_env == 'prod' -%}{{ vault_automation_prod_address }}{%- elif cluster_user == 'eng' -%}{{ vault_automation_eng_address }}{%- elif cluster_env == 'test' -%}{{ vault_automation_test_address }}{%- else -%}{{ vault_automation_dev_address }}{%- endif -%}
        vault_namespace: "{{ vault_automation_default_namespace }}"
        vault_mount_point: "{{ vault_automation_config_mount_point }}"
        vault_default_path: "{{ cluster_user }}/{{ cluster.name }}"
        kubeconfig_vault_path: "{{ cluster_user }}/{{ cluster.name }}"

    - name: "Verify Vault configuration facts"
      ansible.builtin.debug:
        msg: |
          Vault Address: {{ vault_address }}
          Vault Namespace: {{ vault_namespace }}
          Vault Default Path (Clean): {{ vault_default_path }}
          Vault Mount Point: {{ vault_mount_point }}
