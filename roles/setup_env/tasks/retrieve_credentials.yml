---
- name: "Configure Vault using default configuration based on environment"
  ansible.builtin.set_fact:
    vault_address: "{{ vault_prod_address if cluster_envfull == 'prod' else vault_test_address if cluster_envfull == 'test' else vault_eng_address if cluster_envfull == 'dev' and cluster_user == 'eng' else vault_dev_address }}"
  when: vault_address | length == 0
  no_log: true

- name: Setup vault token from credential
  ansible.builtin.set_fact:
    vault_token: "{% if cluster_user == 'eng' %}{{ vault_token_eng }}{% elif cluster_envfull == 'test' %}{{ vault_token_e2 }}{% elif cluster_envfull == 'prod' %}{{ vault_token_e3 }}{% elif cluster_envfull == 'dev' %}{{ vault_token_e1 }}{% endif %}"
  no_log: true

- name: "Display Vault configuration"
  ansible.builtin.debug:
    msg: |
      Vault configuration:
        Address: {{ vault_address }}
        Namespace: {{ vault_namespace }}
        Mount Point: {{ vault_mount_point }}
        Default Path: {{ vault_default_path }}

# Purpose: Get kubeconfig and SSH private key from Vault using configured parameters
- name: "Verify required Vault variables"
  ansible.builtin.assert:
    that:
      - vault_address is defined and vault_address | length > 0
      - vault_namespace is defined and vault_namespace | length > 0
      - vault_default_path is defined and vault_default_path | length > 0
      - vault_mount_point is defined and vault_mount_point | length > 0
    fail_msg: "Missing required Vault variables. Please ensure vault_address, vault_namespace, vault_default_path, and vault_mount_point are set."
    success_msg: "All required Vault variables are present."

- name: "Check for Vault token in environment variable"
  ansible.builtin.set_fact:
    vault_token: "{{ ansible_env.VAULT_TOKEN | default('') }}"
  when: vault_token | length == 0
  no_log: true

- name: "Create tmp directory for vault token"
  ansible.builtin.file:
    path: "{{ playbook_dir }}/tmp"
    state: directory
    mode: '0700'
  when: vault_token | length > 0
  no_log: true

- name: "Write vault token to tmp file"
  ansible.builtin.copy:
    content: "{{ vault_token }}"
    dest: "{{ vault_token_file }}"
    mode: '0600'
  when: vault_token | length > 0
  no_log: true

- name: "Read vault token from tmp file"
  ansible.builtin.set_fact:
    vault_token: "{{ lookup('ansible.builtin.file', vault_token_file, errors='ignore') | trim | default('') }}"
  when: vault_token | length > 0
  no_log: true

- name: "Validate Vault token is available"
  ansible.builtin.assert:
    that:
      - vault_token | length > 0
    fail_msg: "Could not find Vault token. Please set VAULT_TOKEN environment variable, or set vault_token_file variable, or ensure vault tokens are properly configured for your environment."
    success_msg: "Vault token found successfully"

- name: "Retrieve secrets from Vault"
  community.hashi_vault.vault_kv2_get:
    url: "{{ vault_address }}"
    path: "{{ vault_default_path }}"
    engine_mount_point: "{{ vault_mount_point }}"
    auth_method: token
    token: "{{ vault_token }}"
    namespace: "{{ vault_namespace }}"
    validate_certs: "{{ validate_certs }}"
    ca_cert: "{{ ca_cert_path if validate_certs else omit }}"
  register: vault_secrets_response
  ignore_errors: true
  no_log: true

- name: "Fail if Vault request failed"
  ansible.builtin.fail:
    msg: "Failed to retrieve secrets from Vault: {{ vault_secrets_response.msg | default('Unknown error') }}"
  when: vault_secrets_response is failed

- name: "Verify kubeconfig content exists in Vault response"
  ansible.builtin.assert:
    that:
      - vault_secrets_response.data is defined
      - vault_secrets_response.data.data is defined
      - vault_secrets_response.data.data.kubeconfig is defined
    fail_msg: "Kubeconfig not found in Vault response. Please check the path and key name."
    success_msg: "Kubeconfig found in Vault response."

- name: "Extract kubeconfig data from Vault response"
  ansible.builtin.set_fact:
    kubeconfig_data: "{{ vault_secrets_response.data.data.kubeconfig }}"
  no_log: true

- name: "Verify SSH private key content exists in Vault response"
  ansible.builtin.assert:
    that:
      - vault_secrets_response.data is defined
      - vault_secrets_response.data.data is defined
      - vault_secrets_response.data.data['ssh.private.key'] is defined
    fail_msg: "SSH private key not found in Vault response. Please check the path and key name."
    success_msg: "SSH private key found in Vault response."

- name: "Extract SSH private key from Vault response"
  ansible.builtin.set_fact:
    ssh_private_key: "{{ vault_secrets_response.data.data['ssh.private.key'] }}"
  no_log: true

- name: "Validate kubeconfig data is not empty"
  ansible.builtin.assert:
    that:
      - kubeconfig_data is defined
      - kubeconfig_data | length > 0
      - kubeconfig_data != "null"
    fail_msg: "Retrieved kubeconfig is empty or null"
    success_msg: "Kubeconfig data retrieved successfully"

- name: "Validate SSH private key data is not empty"
  ansible.builtin.assert:
    that:
      - ssh_private_key is defined
      - ssh_private_key | length > 0
      - ssh_private_key != "null"
    fail_msg: "Retrieved SSH private key is empty or null"
    success_msg: "SSH private key data retrieved successfully"

- name: "Log successful credential retrieval"
  ansible.builtin.debug:
    msg: "Successfully retrieved kubeconfig and SSH key from Vault"
