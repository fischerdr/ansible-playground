---
# Write credentials to files
# Purpose: Save kubeconfig and SSH private key to specified directory with proper permissions

- name: "Ensure kubeconfig directory exists"
  ansible.builtin.file:
    path: "{{ kubeconfig_dir }}"
    state: directory
    mode: '0755'
  tags:
    - files
    - credentials

- name: "Set kubeconfig file path"
  ansible.builtin.set_fact:
    kubeconfig_path: "{{ kubeconfig_dir }}/{{ cluster_name }}.kubeconfig"
  tags:
    - files
    - credentials

- name: "Set SSH key file path"
  ansible.builtin.set_fact:
    ssh_key_path: "{{ kubeconfig_dir }}/{{ cluster_name }}.sshpriv"
  tags:
    - files
    - credentials

- name: "Write kubeconfig to file"
  ansible.builtin.copy:
    content: "{{ kubeconfig_data }}"
    dest: "{{ kubeconfig_path }}"
    mode: "{{ kubeconfig_file_mode }}"
    backup: true
  tags:
    - files
    - credentials

- name: "Write SSH private key to file"
  ansible.builtin.copy:
    content: "{{ ssh_private_key }}"
    dest: "{{ ssh_key_path }}"
    mode: "{{ ssh_key_file_mode }}"
    backup: true
  tags:
    - files
    - credentials

- name: "Log successful credential file creation"
  ansible.builtin.debug:
    msg: |
      Credentials written successfully:
        Kubeconfig: {{ kubeconfig_path }}
        SSH Key: {{ ssh_key_path }}
  tags:
    - files
    - credentials
