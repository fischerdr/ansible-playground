---
# DEPRECATED: This file uses legacy shell commands and uri module
# USE px_vault_setup_aap.yml instead - it uses proper kubernetes.core and community.hashi_vault modules
# This file is retained for backward compatibility only and will be removed in a future release

- name: "DEPRECATED | Warn about legacy task file usage"
  ansible.builtin.debug:
    msg: >-
      WARNING: px_vault_setup.yml is deprecated. This file uses legacy shell commands
      and direct URI calls instead of proper Ansible modules. Please migrate to using
      px_vault_setup_aap.yml which uses kubernetes.core.k8s and community.hashi_vault modules.
      This file will be removed in a future release.

- name: "DEPRECATED | Fail with deprecation message"
  ansible.builtin.fail:
    msg: >-
      px_vault_setup.yml is deprecated and should not be used.
      Update your playbooks to use the main role entry point which includes px_vault_setup_aap.yml.
      If you must use this legacy file, set 'allow_deprecated_vault_tasks: true' in your playbook.
  when: allow_deprecated_vault_tasks is not defined or not allow_deprecated_vault_tasks
