---
# tasks/read_kv2_secrets.yml - Read and validate KV2 secrets
#
# Purpose:
#   Reads back secrets from KV2 engine to validate write operations.
#   Demonstrates proper KV2 read API usage with community.hashi_vault.

- name: Read secrets from KV2 engine using community.hashi_vault
  block:
    - name: Read secret from {{ item.path }} using vault_kv2_get
      community.hashi_vault.vault_kv2_get:
        url: "{{ vault_kv2_demo_vault_addr }}"
        engine_mount_point: "{{ vault_kv2_demo_kv2_mount_path }}"
        path: "{{ item.path }}"
        token: "{{ vault_kv2_demo_root_token }}"
        namespace: "{{ vault_kv2_demo_vault_namespace if vault_kv2_demo_vault_namespace | length > 0 else omit }}"
        validate_certs: "{{ vault_kv2_demo_validate_certs }}"
        ca_cert: "{{ vault_kv2_demo_ca_cert if vault_kv2_demo_ca_cert else omit }}"
      register: read_secret_result
      no_log: "{{ not vault_kv2_demo_display_secrets }}"
      loop: "{{ vault_kv2_demo_secrets }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Validate secret data structure
      ansible.builtin.assert:
        that:
          - item.data is defined
          - item.data.data is defined
          - item.data.metadata is defined
          - item.data.metadata.version is defined
        fail_msg: "Secret at {{ item.item.path }} does not have expected KV2 structure"
        success_msg: "Secret at {{ item.item.path }} validated successfully"
        quiet: true
      loop: "{{ read_secret_result.results }}"
      loop_control:
        label: "{{ item.item.path }}"

    - name: Display read secrets summary
      ansible.builtin.debug:
        msg: |
          ========================================
          Secrets Read and Validated
          ========================================
          Total Secrets: {{ read_secret_result.results | length }}
          All secrets have proper KV2 structure:
          {% for result in read_secret_result.results %}
            - {{ result.item.path }}: Version {{ result.data.metadata.version }}
          {% endfor %}
          ========================================

    - name: Display secret data (if enabled)
      ansible.builtin.debug:
        msg: |
          Secret Path: {{ item.item.path }}
          Version: {{ item.data.metadata.version }}
          Created: {{ item.data.metadata.created_time }}
          Data Keys: {{ item.data.data.keys() | list }}
          {% if vault_kv2_demo_display_secrets %}
          Data:
          {{ item.data.data | to_nice_yaml }}
          {% endif %}
      loop: "{{ read_secret_result.results }}"
      loop_control:
        label: "{{ item.item.path }}"
      when: vault_kv2_demo_display_secrets

    - name: Verify written data matches expected data
      ansible.builtin.assert:
        that:
          - item.data.data.keys() | list | sort == item.item.data.keys() | list | sort
        fail_msg: "Secret keys at {{ item.item.path }} do not match expected keys"
        success_msg: "Secret keys at {{ item.item.path }} match expected keys"
        quiet: true
      loop: "{{ read_secret_result.results }}"
      loop_control:
        label: "{{ item.item.path }}"

  rescue:
    - name: Handle secret read failure
      ansible.builtin.fail:
        msg: |
          Failed to read secret from KV2 engine.
          Path: {{ item.path | default('unknown') }}
          Error: {{ ansible_failed_result.msg | default('Unknown error') }}
          Verify path exists and token has read permissions.

- name: List secrets in KV2 engine
  block:
    - name: List all secret paths under {{ vault_kv2_demo_kv2_mount_path }}
      community.hashi_vault.vault_list:
        url: "{{ vault_kv2_demo_vault_addr }}"
        path: "{{ vault_kv2_demo_kv2_mount_path }}/metadata"
        auth_method: token
        token: "{{ vault_kv2_demo_root_token }}"
        namespace: "{{ vault_kv2_demo_vault_namespace if vault_kv2_demo_vault_namespace | length > 0 else omit }}"
        validate_certs: "{{ vault_kv2_demo_validate_certs }}"
        ca_cert: "{{ vault_kv2_demo_ca_cert if vault_kv2_demo_ca_cert else omit }}"
      register: list_secrets_result
      no_log: false
      changed_when: false

    - name: Display list of secrets
      ansible.builtin.debug:
        msg: |
          Secrets found in {{ vault_kv2_demo_kv2_mount_path }}:
          {{ list_secrets_result.data.keys if list_secrets_result.data is defined and list_secrets_result.data.keys is defined else 'None' }}

  rescue:
    - name: Handle list operation failure
      ansible.builtin.debug:
        msg: |
          Warning: Could not list secrets in {{ vault_kv2_demo_kv2_mount_path }}.
          This may be expected if the mount is empty or permissions are restricted.
          Error: {{ ansible_failed_result.msg | default('Unknown error') }}

- name: Display validation completion
  ansible.builtin.debug:
    msg: |
      ========================================
      Secret Validation Complete
      ========================================
      All {{ vault_kv2_demo_secrets | length }} secrets successfully:
      - Written to KV2 engine
      - Read back from KV2 engine
      - Validated for structure and content
      ========================================
