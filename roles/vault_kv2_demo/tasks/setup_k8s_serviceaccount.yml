---
# tasks/setup_k8s_serviceaccount.yml - Kubernetes service account setup
#
# Purpose:
#   Creates Kubernetes service account, ClusterRoleBinding, and token secret
#   required for Vault Kubernetes authentication method.
#
# Resources Created:
#   - ServiceAccount for Vault authentication
#   - ClusterRoleBinding for system:auth-delegator role
#   - Secret with service account token

- name: Create ServiceAccount for Vault authentication
  block:
    - name: Ensure ServiceAccount {{ vault_kv2_demo_service_account_name }} exists in {{ vault_kv2_demo_k8s_namespace }}
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: "{{ vault_kv2_demo_service_account_name }}"
            namespace: "{{ vault_kv2_demo_k8s_namespace }}"
            labels:
              app: vault-demo
              component: authentication
        kubeconfig: "{{ vault_kv2_demo_kubeconfig if vault_kv2_demo_kubeconfig else omit }}"
        verify_ssl: "{{ vault_kv2_demo_k8s_verify_ssl }}"
        ca_cert: "{{ vault_kv2_demo_k8s_ssl_ca_cert if vault_kv2_demo_k8s_ssl_ca_cert else omit }}"
      register: serviceaccount_result

    - name: Display ServiceAccount creation result
      ansible.builtin.debug:
        msg: "ServiceAccount {{ vault_kv2_demo_service_account_name }} {{ 'created' if serviceaccount_result.changed else 'already exists' }}"

  rescue:
    - name: Handle ServiceAccount creation failure
      ansible.builtin.fail:
        msg: |
          Failed to create ServiceAccount {{ vault_kv2_demo_service_account_name }}.
          Error: {{ ansible_failed_result.msg | default('Unknown error') }}
          Ensure you have proper RBAC permissions in the Kubernetes cluster.

- name: Create ClusterRoleBinding for token review
  block:
    - name: Ensure ClusterRoleBinding vault-tokenreview-{{ vault_kv2_demo_service_account_name }} exists
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: "vault-tokenreview-{{ vault_kv2_demo_service_account_name }}"
            labels:
              app: vault-demo
              component: authentication
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: system:auth-delegator
          subjects:
            - kind: ServiceAccount
              name: "{{ vault_kv2_demo_service_account_name }}"
              namespace: "{{ vault_kv2_demo_k8s_namespace }}"
        kubeconfig: "{{ vault_kv2_demo_kubeconfig if vault_kv2_demo_kubeconfig else omit }}"
        verify_ssl: "{{ vault_kv2_demo_k8s_verify_ssl }}"
        ca_cert: "{{ vault_kv2_demo_k8s_ssl_ca_cert if vault_kv2_demo_k8s_ssl_ca_cert else omit }}"
      register: clusterrolebinding_result

    - name: Display ClusterRoleBinding creation result
      ansible.builtin.debug:
        msg: "ClusterRoleBinding {{ 'created' if clusterrolebinding_result.changed else 'already exists' }}"

  rescue:
    - name: Handle ClusterRoleBinding creation failure
      ansible.builtin.fail:
        msg: |
          Failed to create ClusterRoleBinding vault-tokenreview-{{ vault_kv2_demo_service_account_name }}.
          Error: {{ ansible_failed_result.msg | default('Unknown error') }}
          Ensure you have cluster-admin or equivalent permissions.

- name: Create service account token Secret
  block:
    - name: Ensure service account token Secret {{ vault_kv2_demo_sa_token_secret_name }} exists
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ vault_kv2_demo_sa_token_secret_name }}"
            namespace: "{{ vault_kv2_demo_k8s_namespace }}"
            annotations:
              kubernetes.io/service-account.name: "{{ vault_kv2_demo_service_account_name }}"
            labels:
              app: vault-demo
              component: authentication
          type: kubernetes.io/service-account-token
        kubeconfig: "{{ vault_kv2_demo_kubeconfig if vault_kv2_demo_kubeconfig else omit }}"
        verify_ssl: "{{ vault_kv2_demo_k8s_verify_ssl }}"
        ca_cert: "{{ vault_kv2_demo_k8s_ssl_ca_cert if vault_kv2_demo_k8s_ssl_ca_cert else omit }}"
      register: token_secret_result

    - name: Display token Secret creation result
      ansible.builtin.debug:
        msg: "Token Secret {{ vault_kv2_demo_sa_token_secret_name }} {{ 'created' if token_secret_result.changed else 'already exists' }}"

  rescue:
    - name: Handle token Secret creation failure
      ansible.builtin.fail:
        msg: |
          Failed to create token Secret {{ vault_kv2_demo_sa_token_secret_name }}.
          Error: {{ ansible_failed_result.msg | default('Unknown error') }}

- name: Wait for service account token to be populated
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ vault_kv2_demo_sa_token_secret_name }}"
    namespace: "{{ vault_kv2_demo_k8s_namespace }}"
    kubeconfig: "{{ vault_kv2_demo_kubeconfig if vault_kv2_demo_kubeconfig else omit }}"
    verify_ssl: "{{ vault_kv2_demo_k8s_verify_ssl }}"
    ca_cert: "{{ vault_kv2_demo_k8s_ssl_ca_cert if vault_kv2_demo_k8s_ssl_ca_cert else omit }}"
  register: sa_token_secret
  until:
    - sa_token_secret.resources is defined
    - sa_token_secret.resources | length > 0
    - sa_token_secret.resources[0].data is defined
    - sa_token_secret.resources[0].data.token is defined
  retries: "{{ vault_kv2_demo_retries }}"
  delay: "{{ vault_kv2_demo_retry_delay }}"
  failed_when: false

- name: Validate service account token was generated
  ansible.builtin.assert:
    that:
      - sa_token_secret.resources is defined
      - sa_token_secret.resources | length > 0
      - sa_token_secret.resources[0].data.token is defined
    fail_msg: "Service account token was not generated. Check ServiceAccount and Secret configuration."
    success_msg: "Service account token successfully generated"

- name: Extract and store service account JWT token
  ansible.builtin.set_fact:
    vault_kv2_demo_sa_jwt_token: "{{ (sa_token_secret.resources[0].data.token | b64decode) | trim }}"
    vault_kv2_demo_sa_ca_cert: "{{ (sa_token_secret.resources[0].data['ca.crt'] | b64decode) | trim }}"
  no_log: true
  changed_when: false

- name: Display Kubernetes setup completion
  ansible.builtin.debug:
    msg: |
      ========================================
      Kubernetes Resources Created Successfully
      ========================================
      ServiceAccount: {{ vault_kv2_demo_service_account_name }}
      Namespace: {{ vault_kv2_demo_k8s_namespace }}
      Token Secret: {{ vault_kv2_demo_sa_token_secret_name }}
      ClusterRoleBinding: vault-tokenreview-{{ vault_kv2_demo_service_account_name }}
      ========================================
