---
# tasks/write_kv2_secrets.yml - Write example secrets to KV2 engine
#
# Purpose:
#   Writes example secrets to the KV2 secret engine at configured paths.
#   Demonstrates KV2 data structure and API usage.

- name: Write secrets to KV2 engine
  block:
    - name: Write secret to {{ vault_kv2_demo_kv2_mount_path }}/{{ item.path }}
      community.hashi_vault.vault_write:
        url: "{{ vault_kv2_demo_vault_addr }}"
        path: "{{ vault_kv2_demo_kv2_mount_path }}/data/{{ item.path }}"
        data:
          data: "{{ item.data }}"
        auth_method: token
        token: "{{ vault_kv2_demo_root_token }}"
        namespace: "{{ vault_kv2_demo_vault_namespace if vault_kv2_demo_vault_namespace | length > 0 else omit }}"
        validate_certs: "{{ vault_kv2_demo_validate_certs }}"
        ca_cert: "{{ vault_kv2_demo_ca_cert if vault_kv2_demo_ca_cert else omit }}"
      register: write_secret_result
      no_log: true
      retries: "{{ vault_kv2_demo_retries }}"
      delay: "{{ vault_kv2_demo_retry_delay }}"
      loop: "{{ vault_kv2_demo_secrets }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Display write operation summary
      ansible.builtin.debug:
        msg: "Successfully wrote {{ vault_kv2_demo_secrets | length }} secrets to KV2 engine"

  rescue:
    - name: Handle secret write failure
      ansible.builtin.fail:
        msg: |
          Failed to write secret to KV2 engine.
          Path: {{ item.path | default('unknown') }}
          Error: {{ ansible_failed_result.msg | default('Unknown error') }}
          Verify path format and token permissions.

- name: Display written secrets summary
  ansible.builtin.debug:
    msg: |
      ========================================
      Secrets Written to KV2 Engine
      ========================================
      Mount Path: {{ vault_kv2_demo_kv2_mount_path }}
      Total Secrets: {{ vault_kv2_demo_secrets | length }}
      Paths:
      {% for secret in vault_kv2_demo_secrets %}
        - {{ vault_kv2_demo_kv2_mount_path }}/data/{{ secret.path }}
      {% endfor %}
      ========================================
